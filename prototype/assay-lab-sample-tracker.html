<title>Assay Lab Sample Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a control-room console. Lookup bar on top, tabbed work areas below, sample record as a job card with a stage rail. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2321; --muted:#5e6864; --line:#d9ddd9; --soft:#e8ebe8;
  --accent:#9a6b12; --accent-ink:#ffffff; --accent-soft:#f5ead2;
  --ok:#2f7d4f; --ok-soft:#e1f1e6; --warn:#a4570c; --warn-soft:#fbe9d6; --bad:#b3302a; --bad-soft:#f8e0de; --info:#2c5d7c; --info-soft:#dfeaf2;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1c211f; --ink:#e6e9e7; --muted:#9aa4a0; --line:#2f3633; --soft:#252b28;
  --accent:#d6a443; --accent-ink:#1a1405; --accent-soft:#3a2f17;
  --ok:#6cc48f; --ok-soft:#1d3326; --warn:#e8a25a; --warn-soft:#3a2a17; --bad:#ef7d75; --bad-soft:#3d1f1d; --info:#7fb4d6; --info-soft:#1c2d38;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1c211f; --ink:#e6e9e7; --muted:#9aa4a0; --line:#2f3633; --soft:#252b28;
  --accent:#d6a443; --accent-ink:#1a1405; --accent-soft:#3a2f17;
  --ok:#6cc48f; --ok-soft:#1d3326; --warn:#e8a25a; --warn-soft:#3a2a17; --bad:#ef7d75; --bad-soft:#3d1f1d; --info:#7fb4d6; --info-soft:#1c2d38;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;letter-spacing:.01em}
h2{font-size:21px}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.who{font-size:13px;color:var(--muted)}

.lookup{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.lookup input{flex:1 1 260px;min-width:0;font-family:var(--f-mono);font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--panel)}
.lookup input:focus{border-color:var(--accent);outline:none}
.lookup input::placeholder{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:12px 20px;font-size:16px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

nav.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--f-mono);font-size:12px;background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:4px}
section.view{padding-top:20px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--ink);font-size:14px}
.notice.warn{background:var(--warn-soft)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:6px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--accent-soft);color:var(--accent)}

/* Job card */
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-start}
.sid{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.03em}
.eta{background:var(--soft);border-radius:var(--r);padding:12px 16px;min-width:220px}
.eta .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.eta .val{font-family:var(--f-display);font-size:22px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px;padding-top:1px}
dl.facts dd{margin:0;overflow-wrap:anywhere}

ol.rail{list-style:none;margin:0;padding:0}
ol.rail li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding-bottom:14px}
ol.rail li:last-child{padding-bottom:0}
ol.rail li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--line)}
ol.rail li:last-child::before{display:none}
ol.rail li.done::before{background:var(--ok)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;z-index:1}
li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--panel)}
li.current .dot{border-color:var(--accent);background:var(--accent-soft)}
li.current .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
li.current.late .dot{border-color:var(--bad);background:var(--bad-soft)}
li.current.late .dot::after{background:var(--bad)}
.st-name{font-weight:600}
li.upcoming .st-name{color:var(--muted);font-weight:500}
.st-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.hist li:first-child{border-top:0}
.hist time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

.actions{border-top:1px dashed var(--line);margin-top:4px;padding-top:16px}

/* Forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .req{color:var(--bad)}
.f input,.f select,.f textarea,.inp{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-weight:400;color:var(--ink);font-size:15px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--accent);outline:none}
fieldset{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400;color:var(--ink);font-size:14px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* Board */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lane{background:var(--soft);border-radius:var(--r);padding:10px;min-width:0}
.lane h4{margin:0 0 8px;font-family:var(--f-display);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.lane h4 span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;padding:7px 9px;margin-top:6px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip.late{border-left-color:var(--bad)}
.chip.urgent{border-left-color:var(--accent)}
.chip .cid{font-family:var(--f-mono);font-size:13px;font-weight:600}
.chip .cmeta{font-size:12px;color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft);white-space:nowrap}
td{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td .linkish{background:none;border:0;padding:0;font-family:var(--f-mono);font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.dir-in{color:var(--ok);font-weight:700}
.dir-out{color:var(--info);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:10;max-width:calc(100% - 32px)}
.label-strip{display:flex;flex-wrap:wrap;gap:6px}
.label-strip code{font-family:var(--f-mono);background:var(--soft);padding:3px 8px;border-radius:4px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .15s,filter .15s}}
/* Sign-in screen */
.login-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:760px){.login-grid{grid-template-columns:minmax(0,1fr)}}
.mock{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--warn);border-radius:var(--r);background:var(--warn-soft);font-size:13px}
.mock b{white-space:nowrap}
.demo-list{display:grid;gap:8px}
.demo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.demo .r{font-size:12px;color:var(--muted)}
.demo code{font-family:var(--f-mono);font-size:13px}
.role-chip{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.me-box{display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--soft);font-weight:600;color:var(--ink);font-size:15px}
/* Workflow routes */
.code{font-family:var(--f-mono);font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px;white-space:nowrap}
.route-box{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
ol.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
ol.steps li{font-size:13px;background:var(--soft);border-radius:4px;padding:3px 8px;border-left:3px solid var(--line)}
ol.steps li span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.ph-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:4px;background:var(--soft);border-left:3px solid var(--line);white-space:nowrap}
.ph-intake{border-left-color:var(--info)!important}
.ph-prep{border-left-color:var(--warn)!important}
.ph-test{border-left-color:var(--accent)!important}
.ph-qc{border-left-color:var(--ok)!important}
.ph-await,.ph-report,.ph-store{border-left-color:var(--muted)!important}
.lane{border-top:3px solid var(--line)}
.lane.ph-intake{border-top-color:var(--info)} .lane.ph-prep{border-top-color:var(--warn)} .lane.ph-test{border-top-color:var(--accent)} .lane.ph-qc{border-top-color:var(--ok)}
.chip .rc{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:600;margin-left:4px}
details.route{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.route>summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
details.route[open]>summary{border-bottom:1px solid var(--line)}
details.route .body{padding:14px;display:flex;flex-direction:column;gap:12px}
td.note{color:var(--muted);font-size:13px;min-width:220px}
ul.tight{margin:4px 0 0;padding-left:18px}
.subtle{font-size:13px;color:var(--muted)}
.st-note{font-size:13px;color:var(--muted);margin-top:2px}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more>summary{cursor:pointer;font-weight:600;font-size:14px}
.cat-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 12px;align-items:start}
@media (max-width:640px){.cat-row{grid-template-columns:minmax(0,1fr)}}
.cat-name{font-weight:600;font-size:14px;padding-top:3px}
.cat-tests{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font:inherit;font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--ink);text-align:left}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
/* v10: skipped steps, hazards, reversals, reconciliation, tab cue */
li.skipped .dot{border-style:dashed;color:var(--muted)}
li.skipped .st-name{color:var(--muted);font-weight:500}
li.skipped::before{background:var(--line)}
.haz{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--bad-soft);color:var(--bad);margin-right:4px;white-space:nowrap}
.haz.two{background:var(--warn-soft);color:var(--warn)}
tr.reversed td{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
tr.reversed td .pill,tr.reversed td .linkish{text-decoration:none}
.dir-rev{color:var(--warn);font-weight:700}
.recon{padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:var(--r);background:var(--panel);font-size:14px}
nav.tabs{scrollbar-width:thin}
nav.tabs.more-r{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
nav.tabs.more-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 18%);mask-image:linear-gradient(to right,transparent,#000 18%)}
nav.tabs.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(to right,transparent,#000 18%,#000 82%,transparent)}
#matBox td{vertical-align:top}
.stats{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
/* v11: results, certificates, lab batches */
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.btn.small{padding:5px 10px;font-size:13px}
.notice.bad{background:var(--bad-soft)}
.notice.ok{background:var(--ok-soft)}
table.res td:nth-child(2){white-space:nowrap}
table.bpos tr.qcrow td{background:var(--soft)}
table.bpos td{vertical-align:middle}
tr.sel td{background:var(--accent-soft)}
svg.chart{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
svg.chart line{stroke-width:1.5}
svg.chart .cl-c{stroke:var(--ok)}
svg.chart .cl-w{stroke:var(--warn);stroke-dasharray:5 4}
svg.chart .cl-f{stroke:var(--bad);stroke-dasharray:2 4}
svg.chart .cl-line{stroke:var(--muted);stroke-width:1.5}
svg.chart text{font-size:11px;fill:var(--muted);font-family:var(--f-mono)}
svg.chart circle{stroke:var(--panel);stroke-width:1.5}
.cert-overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.55);overflow:auto;padding:16px}
.cert-overlay[hidden]{display:none}
.cert-wrap{max-width:820px;margin:0 auto}
.cert-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:var(--r) var(--r) 0 0;position:sticky;top:-16px;z-index:1}
.cert{--bg:#fff;--panel:#fff;--ink:#1d2321;--muted:#5e6864;--line:#d9ddd9;--soft:#eef0ee;--accent:#9a6b12;
  background:var(--panel);color:var(--ink);padding:32px;font-size:15px;display:flex;flex-direction:column;gap:18px}
.cert-wrap .cert{border-radius:0 0 var(--r) var(--r)}
.cert-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:12px;flex-wrap:wrap}
.cert-head h2{margin:2px 0 0;font-family:var(--f-display);font-size:26px}
.cert-org{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.cert-no{text-align:right;font-size:13px;color:var(--muted)}
.cert-no .mono{font-size:17px;font-weight:700;color:var(--ink)}
.cert-amend{border:1px solid #a4570c;background:#fbe9d6;color:#5c3106;padding:10px 12px;border-radius:var(--r);font-weight:600}
.cert table{font-size:14px}
.cert-facts th{width:32%;text-transform:none;letter-spacing:0;font-size:13px;background:none;font-weight:600}
.cert-facts th,.cert-facts td{padding:5px 8px}
.cert-res{border:1px solid var(--line)}
.cert-note{font-size:13px;border-left:3px solid #a4570c;padding:6px 10px;background:#fbf3ea}
.cert-sign{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.cert-foot{font-size:12px;color:var(--muted)}
body.cert-only{background:#fff;padding:24px;max-width:860px;margin:0 auto}
@media (max-width:640px){.cert{padding:18px}.cert-facts th{width:40%}}
@media print{
  body.print-cert{background:#fff}
  body.print-cert .wrap,body.print-cert .toast,body.print-cert .cert-bar{display:none!important}
  body.print-cert .cert-overlay{position:static;background:none;padding:0;overflow:visible}
  body.print-cert .cert{padding:0}
  body.cert-only{padding:0}
}
/* v12: number read-back, limits */
.numhint{display:block;font-size:12px;color:var(--muted);margin-top:2px;min-height:0}
.numhint:empty{display:none}
.numhint.bad{color:var(--bad);font-weight:600}
table.bpos .numhint{max-width:130px}
#bdAlerts .linkish,#bdTrends .linkish{font-weight:600}
/* A batch checking several results scrolls sideways; the position stays in view. */
table.bpos.multi td.pos-cell,table.bpos.multi th:first-child{position:sticky;left:0;z-index:1;background:var(--panel);min-width:170px;max-width:200px;box-shadow:1px 0 0 var(--line)}
table.bpos.multi thead th:first-child{background:var(--soft)}
table.bpos.multi tr.qcrow td.pos-cell{background:var(--soft)}
table.bpos.multi tr.sel td.pos-cell{background:var(--accent-soft)}
table.bpos.multi td.pos-cell .mono{white-space:nowrap}
/* v14: Settings tabs, lab working hours, bag labels */
.subtabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.subtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.daychip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:3px 10px;font-size:13px}
.label-sheet{display:flex;flex-wrap:wrap;gap:4mm;justify-content:center;background:var(--soft);padding:16px;border-radius:0 0 var(--r) var(--r)}
.bag-label{width:100mm;height:50mm;box-sizing:border-box;padding:3mm;display:flex;gap:3mm;align-items:center;background:#fff;color:#000;border:1px dashed #9aa19d;font-family:var(--f-body);overflow:hidden;break-inside:avoid;page-break-inside:avoid}
.bl-qr{flex:0 0 40mm;height:40mm}
.bl-qr svg{width:40mm;height:40mm;display:block}
.bl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.7mm}
.bl-org{font-size:2.8mm;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.bl-id{font:700 4.6mm/1.15 var(--f-mono);white-space:nowrap;letter-spacing:-.02em}
.bl-line{display:flex;gap:2mm;font-size:3.3mm;line-height:1.25;min-width:0}
.bl-line span{flex:0 0 16mm;color:#444}
.bl-line b{min-width:0;overflow-wrap:anywhere;max-height:2.5em;overflow:hidden}
.bl-flags{display:flex;flex-wrap:wrap;gap:1mm;margin-top:.5mm}
.bl-flags b{border:.3mm solid #000;padding:0 1mm;font-size:2.9mm}
body.labels-only{background:#fff;margin:0}
body.labels-only .label-sheet{background:none;padding:0;justify-content:flex-start}
@media screen and (max-width:440px){.label-sheet .bag-label{zoom:.8}}
@media print{
  body.print-label{background:#fff}
  body.print-label .wrap,body.print-label .toast,body.print-label .cert-bar{display:none!important}
  body.print-label .cert-overlay{position:static;background:none;padding:0;overflow:visible}
  body.print-label .cert-wrap{max-width:none}
  .label-sheet{background:none!important;padding:0!important;gap:0 4mm;justify-content:flex-start}
  .label-sheet.roll{gap:0}
  .label-sheet.roll .bag-label{border:0;break-after:page;page-break-after:always}
  .label-sheet .bag-label{border-color:#ccc;zoom:1}
}

:root{--r:8px;--tap:44px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
  --brand:#1e2925;--brand-2:#2b3934;--brand-ink:#f3f0e7;--brand-muted:#b4bfb9;--shadow:0 1px 2px rgba(20,28,24,.05),0 2px 10px rgba(20,28,24,.05);--lift:0 10px 30px rgba(10,16,13,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#0d1311;--brand-2:#18211e;--shadow:none;--lift:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--brand:#0d1311;--brand-2:#18211e;--shadow:none;--lift:0 10px 30px rgba(0,0,0,.5)}
:root[data-theme="light"]{color-scheme:light}
.wrap{padding-top:0}
.panel{box-shadow:var(--shadow)}
/* Header: brand bar with logo, search and account */
header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 24px;padding:14px 0 16px;border-bottom:0;background:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 100vmax var(--brand);clip-path:inset(0 -100vmax)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-t{min-width:0}
header.top .brand small{color:var(--brand-muted);font-size:11px}
header.top h1{font-size:22px;color:var(--brand-ink);white-space:nowrap}
.logo{flex:none;display:grid;place-items:center;height:42px;min-width:42px;max-width:150px;border-radius:var(--r);background:var(--accent);overflow:hidden}
.logo::before{content:"";width:24px;height:24px;background:#fff;-webkit-mask:var(--ic-flask) center/contain no-repeat;mask:var(--ic-flask) center/contain no-repeat}
.logo.has-img{background:#fff;padding:4px 7px}
.logo.has-img::before{display:none}
.logo img{display:block;height:34px;width:auto;max-width:136px;object-fit:contain}
header.top .lookup{grid-column:1/-1;grid-row:2;margin:0;flex-wrap:nowrap;width:100%}
header.top .lookup input{flex:1 1 auto;font-size:18px;padding:8px 14px;min-height:48px;border:1px solid transparent;background:var(--panel);color:var(--ink)}
header.top .lookup input::placeholder{font-size:15px}
header.top .lookup .btn.big{min-height:48px;padding:0 20px;font-size:15px;white-space:nowrap}
.top-meta{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:nowrap;min-width:0}
header.top .pill{background:rgba(255,255,255,.1);color:var(--brand-ink)}
header.top .pill.ok{background:rgba(108,196,143,.16);color:#a3e2ba}
header.top .pill.warn,header.top .pill.gold{background:rgba(232,162,90,.16);color:#f2c48f}
header.top .pill.bad{background:rgba(239,125,117,.18);color:#ffb4ae}
header.top .who{color:var(--brand-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
header.top .btn{background:transparent;border-color:rgba(255,255,255,.26);color:var(--brand-ink);min-height:var(--tap)}
header.top .btn:hover{border-color:var(--brand-ink)}
header.top .lookup .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border-radius:var(--r);border:1px solid rgba(255,255,255,.26);background:transparent;color:var(--brand-ink);cursor:pointer}
.icon-btn:hover{border-color:var(--brand-ink)}
.icon-btn::before{content:"";width:20px;height:20px;background:currentColor;-webkit-mask:var(--ic-moon) center/contain no-repeat;mask:var(--ic-moon) center/contain no-repeat}
.icon-btn[aria-pressed="true"]::before{-webkit-mask-image:var(--ic-sun);mask-image:var(--ic-sun)}
/* Navigation: icons, a More menu when the row is full, a bottom bar on phones */
#tabs{position:relative;display:flex;flex-wrap:nowrap;gap:2px;margin-top:6px;border-bottom:1px solid var(--line);overflow:visible;-webkit-mask-image:none!important;mask-image:none!important}
#tabs>button[data-tab],#tabMore{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;margin:0;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
#tabs button[data-tab]::before,#tabMore::before{content:"";flex:none;width:19px;height:19px;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
#tabs>button[data-tab]:hover,#tabMore:hover{color:var(--ink)}
#tabs>button[aria-selected="true"],#tabMore.on{color:var(--ink);border-bottom-color:var(--accent)}
#tabs .count{margin-left:0}
[data-tab="board"]{--ic:var(--ic-board)} [data-tab="track"]{--ic:var(--ic-track)} [data-tab="submit"]{--ic:var(--ic-submit)} [data-tab="register"]{--ic:var(--ic-register)}
[data-tab="batches"]{--ic:var(--ic-batches)} [data-tab="storage"]{--ic:var(--ic-storage)} [data-tab="results"]{--ic:var(--ic-results)} [data-tab="ledger"]{--ic:var(--ic-ledger)}
[data-tab="routes"]{--ic:var(--ic-routes)} [data-tab="stages"]{--ic:var(--ic-stages)} [data-tab="login"]{--ic:var(--ic-login)} #tabMore{--ic:var(--ic-more)}
.tab-more{position:relative;display:flex}
#tabMore.dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tab-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:230px;padding:6px;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}
#tabMenu button[data-tab]{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 12px;border:0;border-radius:calc(var(--r) - 2px);background:none;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--ink);text-align:left;white-space:nowrap;cursor:pointer}
#tabMenu button[data-tab]:hover{background:var(--soft)}
#tabMenu button[aria-selected="true"]{background:var(--accent-soft)}
@media (max-width:760px){
  header.top{gap:10px;padding:12px 0 14px}
  header.top h1{font-size:19px;white-space:normal}
  header.top .brand small{font-size:10px;letter-spacing:.1em}
  .logo{height:36px;min-width:36px}
  .logo::before{width:21px;height:21px}
  .logo img{height:28px}
  .top-meta{grid-column:1/-1;grid-row:2;justify-content:flex-start;flex-wrap:wrap;gap:6px 8px}
  header.top .who{max-width:100%;flex:1 1 auto}
  header.top .lookup{grid-row:3;position:relative}
  header.top .btn{min-height:36px;padding:5px 12px}
  .icon-btn{width:36px;height:36px}
  header.top .pill,header.top .who{font-size:12px}
  #bdWall{display:none}
  header.top .lookup input{padding-right:58px;font-size:17px}
  header.top .lookup .btn.big{position:absolute;right:4px;top:4px;bottom:4px;min-height:0;width:50px;padding:0}
  header.top .lookup .lk-t{display:none}
  header.top .lookup .btn.big::before{content:"";width:22px;height:22px;background:currentColor;-webkit-mask:var(--ic-track) center/contain no-repeat;mask:var(--ic-track) center/contain no-repeat}
  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;gap:2px;padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -4px 18px rgba(0,0,0,.08)}
  #tabs>button[data-tab],#tabMore{position:relative;flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:3px;min-height:56px;padding:4px 2px;border:0;border-radius:var(--r);font-family:var(--f-body);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
  #tabs>button[data-tab]::before,#tabMore::before{width:22px;height:22px}
  #tabs>button[aria-selected="true"],#tabMore.on{color:var(--accent);background:var(--accent-soft)}
  .tab-more{flex:1 1 0;min-width:0}
  .tab-more #tabMore{width:100%}
  #tabMore.dot::after{position:absolute;top:7px;left:calc(50% + 8px)}
  #tabs .count{position:absolute;top:3px;left:calc(50% + 5px);padding:0 5px;font-size:10px;line-height:15px;background:var(--accent);color:var(--accent-ink)}
  .tab-menu{top:auto;bottom:calc(100% + 10px);right:0;max-height:70vh;overflow:auto}
  .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
/* Touch and readability: 44 px targets for gloved hands on tablets */
.btn{min-height:var(--tap)}
.btn.small{min-height:36px}
.btn.big{min-height:48px}
.f input,.f select,.inp{min-height:var(--tap)}
.f textarea{min-height:88px}
.checks label{min-height:36px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
.subtabs button{min-height:var(--tap)}
.sticky-bar{position:sticky;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);padding:12px 0;margin-bottom:-12px}
@media (max-width:760px){.sticky-bar{bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
.bar{justify-content:flex-end}
/* Tables: zebra rows; long tables keep their header in view */
:where(.tbl-wrap tbody tr:nth-child(even))>td{background:color-mix(in srgb,var(--soft) 50%,var(--panel))}
@media (min-width:761px){
  .tbl-wrap{max-height:min(74vh,900px);overflow:auto}
  .tbl-wrap thead th{position:sticky;top:0;z-index:2}
  table.bpos.multi thead th:first-child{z-index:3}
}
.cert .tbl-wrap,.label-sheet .tbl-wrap{max-height:none;overflow:visible}
#view-stages .tbl-wrap{max-height:none;overflow-y:visible}
/* One radius */
.chip,.code,ol.steps li,.label-strip code,.ph-tag,.haz,.tchip{border-radius:var(--r)}
.tchip{border-radius:999px}
/* Board: summary tiles (zeros included, a tile with samples filters the board), lanes in a grid that scroll after five cards */
.stats.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.stat.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:96px;font:inherit;color:var(--ink);text-align:left}
.stat.tile .n{line-height:1}
.stat.tile .l{line-height:1.3}
button.stat.tile{cursor:pointer}
button.stat.tile:hover{border-color:var(--muted)}
.stat.tile.bad .n{color:var(--bad)} .stat.tile.warn .n{color:var(--warn)} .stat.tile.info .n{color:var(--info)} .stat.tile.ok .n{color:var(--ok)}
.stat.tile[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.bd-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bd-top .grow{flex:1}
.pick-note{display:flex;align-items:center;gap:8px;font-size:14px}
.lane .cards{position:relative;overflow-y:auto;overscroll-behavior:contain}
.lane .cards.scrolls{padding-right:4px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent)}
.lane .cards.scrolls.at-end{-webkit-mask-image:none;mask-image:none}
.chip{border-left-width:4px;padding:8px 10px}
.chip.t-ok{border-left-color:var(--ok)} .chip.t-soon{border-left-color:var(--warn)} .chip.t-late{border-left-color:var(--bad)} .chip.t-wait{border-left-color:var(--info)}
.chip .ctop{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.chip .cid{white-space:nowrap}
.chip .left{font-weight:700;font-variant-numeric:tabular-nums}
.t-ok .left{color:var(--ok)} .t-soon .left{color:var(--warn)} .t-late .left{color:var(--bad)} .t-wait .left{color:var(--info)}
.chip .urg{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
@media (max-width:760px){
  .stats.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat.tile{min-height:84px;padding:10px}
  .stat.tile .n{font-size:24px}
  .stat.tile .l{font-size:12px}
}
/* Wall screen: the board alone, large, for a screen in the lab */
.wall-head{display:none}
body.wall .wrap{max-width:none;padding:14px 22px 22px}
body.wall header.top,body.wall #tabs,body.wall .bd-tools,body.wall .toast{display:none!important}
body.wall section.view{padding-top:0}
body.wall .wall-head{display:flex;align-items:center;gap:16px;margin-bottom:4px}
.wall-head h2{font-size:30px}
.wall-head .clock{margin-left:auto;font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
body.wall .stats.tiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
body.wall .stat.tile .n{font-size:38px}
body.wall .stat.tile .l{font-size:16px}
body.wall .lane h4{font-size:21px}
body.wall .chip{padding:10px 12px}
body.wall .chip .cid{font-size:18px}
body.wall .chip .cmeta,body.wall .chip .left{font-size:15px}
body.wall .lanes{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
/* Sample record: progress, countdown, details on demand */
.prog{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:520px}
.prog-bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ok);border-radius:inherit}
.prog.late .prog-bar i{background:var(--bad)}
.prog.wait .prog-bar i{background:var(--info)}
.prog-t{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-t b{color:var(--ink)}
.eta .cd{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.eta.late{background:var(--bad-soft)} .eta.late .cd{color:var(--bad)}
.eta.done{background:var(--ok-soft)}
details.facts-more{border-top:1px dashed var(--line);padding-top:10px}
details.facts-more>summary{cursor:pointer;font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center}
details.facts-more dl{margin-top:8px}
/* Start page: search and today's numbers */
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 18px;text-align:center}
.hero h2{font-size:28px}
.hero form{display:flex;gap:8px;width:100%;max-width:580px}
.hero input{flex:1;min-width:0;min-height:54px;padding:10px 16px;font-family:var(--f-mono);font-size:21px;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink)}
.hero input::placeholder{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:17px}
.hero input:focus{border-color:var(--accent);outline:none}
.hero .row{justify-content:center}
.today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.today button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;min-height:88px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.today button:hover{border-color:var(--muted)}
.today .n{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.today .l{font-size:14px;color:var(--muted)}
.today .t-in{border-left-color:var(--info)} .today .t-due{border-left-color:var(--warn)} .today .t-late{border-left-color:var(--bad)} .today .t-rel{border-left-color:var(--ok)}
.today .t-late .n{color:var(--bad)}
.today-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
@media (max-width:640px){.today{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:26px 14px}.hero h2{font-size:23px}.hero input{font-size:18px}}
/* Settings: company logo */
.logo-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.logo-prev{display:grid;place-items:center;min-width:120px;height:56px;padding:6px 10px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.logo-prev img{max-height:44px;max-width:200px;display:block}
@media print{header.top,#tabs{display:none!important}}
.eta .cd+.val{font-family:var(--f-body);font-size:15px;font-weight:600}
.eta{min-width:230px}
@media (max-width:760px){.card-head .eta{flex:1 1 100%}}
/* v16 */
.form-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
details.crm-log{margin-top:4px}
details.crm-log summary{cursor:pointer;font-weight:600;min-height:var(--tap);display:flex;align-items:center}
details.crm-log td{vertical-align:top}
/* v17: one entry form; lab staff receive on the spot or submit for later; hand-over fields for samples received later */
#regForm:not(.recv-now) [data-lab]{display:none!important}
#regForm.recv-now [data-hand]{display:none!important}
.recv-toggle{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);font-weight:600;cursor:pointer}
.recv-toggle input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
/* v18: results file preview, batch steps, More details on the entry form, re-assay from lists */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,14,12,.55);overflow:auto;padding:16px;display:flex;align-items:flex-start;justify-content:center}
.modal-card{background:var(--panel);color:var(--ink);border-radius:var(--r);padding:16px 18px;width:100%;max-width:760px;margin:4vh 0;box-shadow:0 12px 40px rgba(0,0,0,.35)}
body.modal-open{overflow:hidden}
.up-sec h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.up-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.up-list li{padding:7px 10px;border-radius:8px;background:var(--soft);border-left:4px solid var(--line);font-size:14px;line-height:1.45}
.up-list li.ok{border-left-color:var(--ok)}
.up-list li.warn{border-left-color:var(--warn)}
.up-list li.bad{border-left-color:var(--bad)}
.up-list .btn{margin-left:6px}
.bsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.bstep{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.bstep:first-child{border-top:0}
.bstep .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--muted);border:2px solid var(--line)}
.bstep.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.bstep.now .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.bstep.todo > div > .row b{color:var(--muted)}
details.form-more{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
details.form-more > summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.form-more[open] > summary{margin-bottom:10px}
details.form-more > .form{margin:0}
.reassay-btn{margin-top:4px}
#rRoute:empty{display:none}
details.route-mini{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--soft)}
details.route-mini > summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.route-mini[open] > summary{margin-bottom:8px}
details.route-mini .route-box{margin:0}
@media (max-width:640px){.modal{padding:0}.modal-card{margin:0;border-radius:0;min-height:100%}}
/* v20: blind QA/QC picks, the bar that issues blind IDs, and the comparison on a record */
.qa-pick{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none}
.qa-pick input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.qa-slot:empty{display:none}
.qa-bar{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-soft);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.qa-of{color:var(--info);margin-top:2px}
.qa-check+.qa-check{border-top:1px solid var(--line);padding-top:10px}
#qaList>summary{cursor:pointer;font-weight:600}
#qaBox .modal-card{max-width:820px}
#labelBox{z-index:40}
@media print{body.print-label .modal{display:none!important}}
.qa-tbl th,.qa-tbl td{padding-left:8px;padding-right:8px}
.qa-tbl .pill{white-space:nowrap}
/* v20: Single sample or Batch on Submit / Register; the batch's sample rows */
.seg{display:inline-flex;align-self:flex-start;padding:3px;gap:3px;border:1px solid var(--line);border-radius:999px;background:var(--soft)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.seg span{display:inline-flex;align-items:center;min-height:38px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.seg input:checked+span{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.batch-box{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);background:var(--bg)}
.brows{width:100%}
.brows th:first-child,.brows td:first-child{width:36px;text-align:right}
.brows td{padding:4px 6px;vertical-align:middle}
.brows td:last-child{width:44px}
.brows .inp{min-height:38px;padding:6px 9px;font-size:14px}
.brows .r-code{font-family:var(--f-mono);text-transform:uppercase}
.brows .r-code::placeholder{text-transform:none}
.brows .inp.dup{border-color:var(--bad);background:var(--bad-soft)}
.bad-t{color:var(--bad);font-weight:600}
@media (max-width:640px){
  .batch-box{padding:10px}
  .brows,.brows tbody{display:block}
  .brows thead{display:none}
  .brows tr{display:grid;grid-template-columns:26px minmax(0,1fr) 40px;gap:4px 6px;padding:6px 0;border-bottom:1px solid var(--line)}
  .brows tr:last-child{border-bottom:0}
  .brows td{display:block;padding:0;border:0;width:auto!important;text-align:left}
  .brows td:nth-child(1){grid-row:1/span 2;align-self:center;text-align:right}
  .brows td:nth-child(3){grid-column:2;grid-row:2}
  .brows td:nth-child(4){grid-column:3;grid-row:1/span 2;align-self:center}
}
/* v20: the chain of custody scrolls after about five entries */
.hist{position:relative}
.hist.scrolls{overflow-y:auto;overscroll-behavior:contain;padding-right:6px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent)}
.hist.scrolls.at-end{-webkit-mask-image:none;mask-image:none}
@media print{.hist.scrolls{max-height:none!important;overflow:visible!important;-webkit-mask-image:none!important;mask-image:none!important}}
/* v21 (polish): search suggestions, recently opened, the same details again, batch progress, tables as cards on a phone. */
.sug{position:fixed;z-index:60;max-height:min(60vh,420px);overflow:auto;padding:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}
.sug-h{padding:6px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sug-i{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"id pill" "m m";align-items:center;gap:2px 10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:calc(var(--r) - 2px);background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.sug-i:hover,.sug-i[aria-selected="true"]{background:var(--soft)}
.sug-i[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent)}
.sug-id{grid-area:id;font-size:15px;font-weight:600;white-space:nowrap}
.sug-i .pill{grid-area:pill;justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-m{grid-area:m;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
/* Recently opened on this device */
.recent{padding-bottom:10px}
.recent-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.recent-h h3{margin:0}
.recent-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id at" "pill pill" "m m";gap:4px 8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);background:var(--panel);color:var(--ink);text-align:left;cursor:pointer;font:inherit;min-height:var(--tap)}
.rec:hover{background:var(--soft)}
.rec-id{grid-area:id;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .pill{grid-area:pill;justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-m{grid-area:m;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-at{grid-area:at;white-space:nowrap}
/* Same as last */
.form-h .last-chip{margin-left:auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Batch page progress */
.bv-prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bv-bar{flex:1 1 220px;max-width:420px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bv-bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s ease}
/* IDs in lists stay on one line */
.tbl-wrap td .linkish[data-open],.tbl-wrap td>a.mono,.tbl-wrap td>.mono:first-child,.tbl-wrap td.mono{white-space:nowrap}
/* Phone: wide tables read as cards */
@media (max-width:640px){
  .tbl-wrap.has-cards{border:0;background:transparent;overflow:visible;max-height:none}
  table.cardy{display:block;width:100%;min-width:0!important;border:0}
  table.cardy thead{display:none}
  table.cardy tbody{display:flex;flex-direction:column;gap:8px}
  table.cardy tr{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  table.cardy td{display:block;position:relative;padding:3px 0 3px calc(40% + 10px);border:0;min-height:22px;background:transparent!important;text-align:left;white-space:normal}
  table.cardy td::before{content:attr(data-label);position:absolute;left:0;top:5px;width:40%;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.cardy td:not([data-label]){padding-left:0}
  table.cardy td:not([data-label])::before{display:none}
  table.cardy td.nil{display:none}
  table.cardy td.mono{white-space:normal;overflow-wrap:anywhere}
  table.cardy td .pill{white-space:normal;max-width:100%}
  .recent-list{grid-template-columns:minmax(0,1fr)}
  .form-h .last-chip{margin-left:0}
}
@media print{.sug,.recent{display:none!important}}
/* v24: a size larger, restrained colour, and the new pieces (departments, evaluation, Results tab, concise routes). */

   the page is wider (1240 px) so the larger type keeps its room. A phone keeps a step smaller so nothing runs off the screen. */
.wrap{max-width:1240px}

.who,header.top .who{font-size:16px}
.notice{font-size:16px}
.pill{font-size:15px;padding:3px 10px;max-width:100%;white-space:normal}
th{font-size:15px}
td{font-size:17px}
.chip .cid{font-size:17px}
.chip .cmeta{font-size:15px}
.lane h4{font-size:18px}
.code{font-size:15px}
ol.steps li,.tchip{font-size:16px}
.btn.small{font-size:16px}
input:not([type=checkbox]):not([type=radio]),.f select,.f textarea,.inp,select{font-size:17px}
.ph-tag{font-size:13px}
.haz,.chip .rc,.chip .urg{font-size:13px}
.numhint,.qa-pick{font-size:15px}
small{font-size:14px}
h4{font-size:15px}
@media (max-width:760px){
  body{font-size:17px}
  .small,.subtle,.st-note,.st-meta,.muted.small,.pick-note,.notice{font-size:15px}
  label,label.f,.legend{font-size:16px}
  .stat.tile .l{font-size:14px}header.top .pill,header.top .who{font-size:14px}.chip .cmeta{font-size:14px}
  td{font-size:16px}.pill{font-size:14px}
}

nav.tabs button{padding:10px 12px;font-size:18px}
nav.tabs .count.flag{background:var(--bad-soft);color:var(--bad)}

/* Colour, v24c: the Sample tab's way. Panels stay white; meaning is carried by soft tints (as the released box), coloured pills and dots,
   and a coloured edge. A tile or card with something in it takes its tint; an empty one keeps its coloured edge and a quiet number. */
:root{--c-ore:#8a5a2b;--c-ore-soft:#f3e7da;--c-plant:#1f6f8b;--c-plant-soft:#dcedf3;--c-env:#2f7d4f;--c-env-soft:#e1f1e6;--c-violet:#6b4fa3;--c-violet-soft:#ebe4f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-ore:#d9a46b;--c-ore-soft:#3a2a1a;--c-plant:#7cc3dc;--c-plant-soft:#16303a;--c-env:#6cc48f;--c-env-soft:#1d3326;--c-violet:#b9a0e8;--c-violet-soft:#2c2340}}
:root[data-theme="dark"]{--c-ore:#d9a46b;--c-ore-soft:#3a2a1a;--c-plant:#7cc3dc;--c-plant-soft:#16303a;--c-env:#6cc48f;--c-env-soft:#1d3326;--c-violet:#b9a0e8;--c-violet-soft:#2c2340}
.stat.tile,.cstats .stat{border-top:4px solid var(--line)}
.stat.tile.info,.stat.c-blue{--t:var(--info);--ts:var(--info-soft)}
.stat.tile.gold{--t:var(--accent);--ts:var(--accent-soft)}
.stat.tile.ok,.stat.c-green{--t:var(--ok);--ts:var(--ok-soft)}
.stat.tile.warn,.stat.c-amber,.stat.c-orange{--t:var(--warn);--ts:var(--warn-soft)}
.stat.tile.bad,.stat.c-red{--t:var(--bad);--ts:var(--bad-soft)}
.stat.c-teal{--t:var(--c-plant);--ts:var(--c-plant-soft)}
.stat.c-violet{--t:var(--c-violet);--ts:var(--c-violet-soft)}
.stat.c-grey{--t:var(--muted);--ts:var(--soft)}
.stat.tile[class*=" "],.cstats .stat[class*="c-"]{border-top-color:var(--t,var(--line))}

   written result or "pick" for one of `opts`, opt: optional, calc: worked out from the results in `from` (never typed; "<DL" counts as 0),
   exact: a reference material must be certified for this exact result (not just the element). chk: acceptance checks on one sample's results;
   a failed check holds the release until the sample is re-assayed or a supervisor accepts it with a reason. qc: the analyte a lab batch checks
   when the route names no other (default the first). Action and permit limits are settings (Settings tab), not part of the method. */

  const res = RESULTS[((r && r.tests) || [])[0]], x = ROUTE_QC[r.code];
  const parts = groups.map(g => { const ans = groupAns(g, res);
    return (groups.length > 1 ? `${ans.map((a, i) => i ? lcName(a.n) : a.n).join(ans.length > 2 ? ", " : " and ")}: ` : "") + qcRuleText(QC_PROFILES[g.p], ans); });
  return parts.join(" ") + (x && x[0] === r.qcp && x[1] ? " " + x[1] : "");
}
DEFAULT_ROUTES.forEach(r => { const x = ROUTE_QC[r.code]; if (!x) return; r.qcp = x[0]; r.qcg = routeGroups(r); r.qc = routeQcText(r, r.qcg); });

let syncers = [];

  const prev = v.dataset.ctx || "", [pid, pst] = prev.split("|"), [nid, nst] = ctx.split("|");

        due ? (now > due ? `<b style="color:var(--bad)">${dur(overBy(due, now, t))} over the ${hoursLabel(t.hours)} allowed</b>` : `due ${fmt(due)}`) : ""].filter(Boolean).join(" · ");

async function leased(docRef, quiet){
  let lease = null;
  for (let i = 0; i < 14 && !(lease && lease.acquired); i++){
    lease = await docRef.acquire({ holder: tabId, ttlMs: 3000 });
    if (!lease.acquired){ const left = Date.parse(lease.expiresAt || "") - Date.now(); await sleep(Math.min(1500, Math.max(120, (left || 300) + 40)) + Math.random() * 120); }
  }
  if (!lease.acquired){ if (!quiet) toast("Someone else is updating this sample. Try again in a moment."); return null; }
  const snap = await docRef.get();
  if (!snap.exists || !snap.data()?.id){ if (!quiet) toast("This sample no longer exists."); return null; }
  return snap.data();
}
/* Times only move forward on a record, even when two devices' clocks disagree. */
const nowAfter = s => Math.max(Date.now(), ...((s.history || []).map(h => (h.at || 0) + 1000)));
const lastTech = s => (s.history || []).slice(-1)[0]?.tech || "someone else";
let moving = false;
/* Runs one change to the sample under a short lease, on the freshest copy. fn(s) returns { upd, moves, msg } or null to stop. */
async function act(fn, opts = {}){
  if (!db || !current?.body || moving || !canEdit()) return false;
  const seen = current.body;
  moving = true; setMoveBusy(true);
  const docRef = db.doc("samples/" + seen.id);
  try {
    const s = await leased(docRef); if (!s) return false;
    if (!opts.anyStage && s.stageKey !== seen.stageKey){ toast(`${s.id} was just moved to ${stage(s, s.stageKey)?.name || s.stageKey} by ${lastTech(s)}. Check it and try again.`); return false; }
    const res = withRelease(s, fn(s)); if (!res) return false;
    const { upd, moves = [], msg } = res;
    upd.updatedAt = Date.now();
    if (moves.length){ upd.ledgerPending = [...(s.ledgerPending || []), ...moves]; upd.lp = true; }
    const sync = derive(s, upd);
    await docRef.update(upd);
    if (sync) await writeStock(docRef, { ...s, ...upd }).catch(() => {});   // still under the lease, so stock records are written in order
    docRef.acquire({ holder: tabId, ttlMs: 1000 }).catch(() => {});   // let go early: the next person need not wait out the lease
    if (moves.length) flushLedger(s.id);
    clearForm(opts.clear);
    toast(msg);
    return true;
  } catch (e) { writeFailed(e); return false; }
  finally { moving = false; setMoveBusy(false); }
}

async function doStep(kind){

  if (kind === "wait"){
    // v24d: the last lab step is done; the sample waits for its results on the Results released step.
    if ((wit = needWitness(s0, "#mvWit")) === null) return;
    await act(s => {
      if (curIdx(s) !== targetIdx(s) - 1 || waitingRes(s) || !resMissing(s)) return null;
      const at = nowAfter(s), name = stage(s, s.stageKey)?.name || s.stageKey;
      const upd = { rw: { key: s.stageKey, at }, history: [...(s.history || []), { key: s.stageKey, sn: name, at, by: session.u, tech: session.name, ref, ...(loc ? { loc } : {}), ...(wit ? { wit } : {}), rw: true, note: note || "Done: waiting for the results" }] };
      if (loc) upd.location = loc;
      return { upd, msg: `${s.id}: ${name} done; waiting for the results` };
    }, { clear: ["mvNote", "mvRef", "mvLoc", "mvWit"] });
    return;
  }

    const nx = p[ci + 1]; if (!nx) return;

    if (nx.target && relSelf(s0) === "admin" && !val("#selfWhy")){ toast("You entered results on this sample: give the reason for releasing them yourself."); $("#selfWhy")?.focus(); return; }
    key = nx.key;
    if ((wit = needWitness(s0, "#mvWit")) === null) return;
  } else {
    if (!note && !ref && !loc){ toast("Type a note, reference or location first."); $("#mvNote")?.focus(); return; }
    wit = val("#mvWit");
  }

    const at = nowAfter(s), to = stage(s, key), h = s.history || [];
    if (key !== s.stageKey && to?.phase === "qc" && stage(s, s.stageKey)?.phase !== "qc"){ const why = qcEntryBlock(s); if (why){ toast(why); return null; } }
    if (to?.target){

  });
}
async function doCorrection(){
  const s0 = current?.body; if (!s0) return;
  const key = val("#mvKey"), why = val("#corrWhy");
  if (!key) return;
  if (!why){ toast("Give the reason for the correction."); $("#corrWhy")?.focus(); return; }
  const p0 = planOf(s0), j0 = p0.findIndex(x => x.key === key);

const inMove = (s, at, recv, note, wit) => baseMove(s, at, "in", `${s.id}~in`, { item: "Sample", qty: recv ? qtyText(recv.bags, recv.mass, recv.unit) : qtyText(s.containers, s.massKg, "kg"), from: s.source || sectionName(s.section) || "Mine site", note: note || "", wit: wit || "" });

/* One ledger document per site day and section; each movement is a key inside it, so two people writing at once never overwrite each other. */

  for (const m of moves) (groups[ledgerDoc(m)] = groups[ledgerDoc(m)] || {})[m.mid] = m;
  for (const [id, ms] of Object.entries(groups)){
    const ref = db.doc("ledger/" + id);
    let snap = await ref.get();
    for (let i = 0; i < 20 && !(snap.exists && snap.data()?.day); i++){
      const lease = await ref.acquire({ holder: tabId, ttlMs: 3000 });
      snap = await ref.get();
      if (snap.exists && snap.data()?.day) break;
      if (lease.acquired){
        const head = { day: id.slice(0, 10), month: id.slice(0, 7), sec: id.slice(11) };
        if (snap.exists) await ref.update(head); else await ref.set({ ...head, m: {} });

      }

    }
    await ref.update({ m: ms });
  }
}

async function flushLedger(sid){
  if (!db || flushing.has(sid)) return; flushing.add(sid);

        const ref = db.doc("samples/" + sid), snap = await ref.get();
        const pend = (snap.exists && snap.data().ledgerPending) || [];

        await writeMoves(pend);

/* Each ID is claimed on its own document under a short lease, so two people submitting at once never wait on each other or get the same number. */
async function claimIds(code, stamp, n, makeBody, progress, from = 1){
  const hint = db.doc(`meta/counter-${code}-${stamp}`);
  let next = from;
  try { const h = await hint.get(); next = Math.max(from, ((h.exists && +h.data().last) || 0) + 1); } catch {}
  const ids = new Array(n); let k = 0, done = 0;
  const worker = async () => {
    while (k < n){
      const i = k++;
      for (let tries = 0; tries < 400 && !ids[i]; tries++){
        const num = next++, id = `${code}-${stamp}-${String(num).padStart(4, "0")}`, ref = db.doc("samples/" + id);
        const lease = await ref.acquire({ holder: tabId, ttlMs: 4000 });
        if (!lease.acquired) continue;
        const snap = await ref.get();
        if (snap.exists && snap.data()?.id) continue;
        await ref.set(makeBody(id, i));
        ref.acquire({ holder: tabId, ttlMs: 1000 }).catch(() => {});   // let the claim lapse quickly so the lab can receive it at once
        ids[i] = id; progress?.(++done);
      }
      if (!ids[i]) throw { code: "busy" };
    }
  };
  await Promise.all(Array.from({ length: Math.min(5, n) }, worker));
  const top = Math.max(...ids.map(x => +x.split("-").pop()));
  hint.get().then(h => { if (!(h.exists && +h.data().last >= top)) return hint.set({ last: top, day: stamp, section: code }); }).catch(() => {});
  return ids;
}

/* Analytes a reference material can certify: the QC analyte of every batch type that uses one. */
function crmAnalytes(){
  const m = new Map();
  for (const r of [...DEFAULT_ROUTES, ...(draft?.routes || [])]){
    const res = RESULTS[(r.tests || [])[0]];
    for (const g of Array.isArray(r.qcg) ? r.qcg : routeGroups(r)){
      if (!QC_PROFILES[g.p]?.ins?.crm) continue;
      for (const a of groupAns(g, res)){
        const sym = a.exact ? a.k : a.k.split("_")[0], key = `${sym}|${a.u || ""}`, el = /^[A-Z][a-z]?$/.test(sym);
        if (!m.has(key)) m.set(key, `${sym === "Au" ? "Gold" : el ? sym : a.n.replace(/ \(.*$/, "")} (${a.u || "no unit"})`);
      }
    }
  }
  const g = qcAnalyte(RESULTS.fa_grav); if (!m.has(`Au|${g.u}`)) m.set(`Au|${g.u}`, `Gold (${g.u})`);
  return new Map([...m].sort((a, b) => a[1].localeCompare(b[1])));
}

  if (!pool.length) pool = ids.filter(id => rows(id).every(c => !useList(c).length));

    for (const k of keys) pts.push(...crmSeries(hist.filter(b => bAns(b).some(ch => ch.k === k && crmMatch(c, ch))), id, k, ""));
  } catch { box.innerHTML = `<p class="small muted">Could not load the results.</p>`; return; }

  const sdMode = pts.every(q => q.sd > 0), sc = q => sdMode ? (q.v - q.exp) / q.sd : (q.v - q.exp) / q.exp * 100;

  const W = 640, Hh = 220, L = 64, R = 12, T = 12, B = 28, x = i => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1)), y = v => T + (hi + pad - v) / (hi - lo + 2 * pad) * (Hh - T - B);

  if (!file || !/^image\//.test(file.type)) throw new Error("Choose a PNG, JPEG or WebP picture.");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("That file could not be read as a picture.")); i.src = url; });

      const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

}

/* Samples still in preparation when their results arrive move to their first analysis step, one step at a time, each step recorded. */

  u.busy = true; $("#upMsg").textContent = "Moving samples…";
  const ok = await pool(u.plan.notReady, 4, sid => sampleWrite(sid, s => {
    const p = planOf(s), ci = curIdx(s), to = p.findIndex((x, i) => i > ci && (x.phase === "test" || x.phase === "qc"));
    if (ci < 1 || to < 0 || to >= targetIdx(s) || readyForResults(s)) return null;

/* The original file, kept once however many batches it fills: files/<ID> describes it, files/<ID>~1, ~2… hold it. */
async function keepFile(u){
  const id = "RF-" + (u.file.sha ? u.file.sha.slice(0, 16).toUpperCase() : dayStamp(Date.now()) + "-" + Math.random().toString(36).slice(2, 8).toUpperCase());
  const ref = db.doc("files/" + id), have = await ref.get().catch(() => null);
  const meta = { id, name: u.file.name, kind: u.file.kind, size: u.file.size, sha: u.file.sha, labRef: u.rep.meta?.ref || "" };
  if (have && have.exists && have.data()?.id) return meta;
  const data = b64(u.bytes), parts = Math.ceil(data.length / FILE_PIECE) || 1;
  for (let i = 0; i < parts; i++) await db.doc(`files/${id}~${i + 1}`).set({ id: `${id}~${i + 1}`, of: id, n: i + 1, data: data.slice(i * FILE_PIECE, (i + 1) * FILE_PIECE) });
  await ref.set({ ...meta, parts, at: Date.now(), by: session.u, tech: session.name });
  return meta;
}

/* A complete set of values is saved and the QC checked at once; an incomplete one waits on the batch as a draft for the missing values. */
async function fileIntoBatch(b, t, f, inst){
  const notYet = b.sids.filter(id => { const s = bs(id); return s && inBatch(s, b.id) && !released(s) && !readyForResults(s); });
  const files = [...(b.files || []).filter(x => x.id !== f.id), { id: f.id, name: f.name, at: Date.now(), tech: session.name }];
  if (!relNow() && (t.miss.length || notYet.length)){   // release at once: what the file holds is saved; the rest of each sample's results is the file
    const ref = db.doc("batches/" + b.id);
    await ref.update({ draft: { at: Date.now(), by: session.u, tech: session.name, file: fileTag(f), vals: t.vals, crms: t.crms }, files, status: "results",
      log: batchLog(b, `Results file ${f.name} attached; ${t.miss.length ? `${t.miss.length} value(s) still to enter` : `${notYet.length} sample(s) not at analysis yet`}`) });
    return `${b.id} draft (${t.miss.length ? `${t.miss.length} missing` : "samples not at analysis"})`;
  }
  const ans = bAns(b), vals = {};
  for (const [p, o] of Object.entries(t.vals)){ const rs = {}; for (const [k, raw] of Object.entries(o)){ const ch = ans.find(a => a.k === k), r = ch && parseRes(raw, ch); if (r && !r.bad && !r.amb) rs[k] = { ...r, by: session.u, src: "file" }; } if (Object.keys(rs).length) vals[p] = rs; }
  const crms = {}; for (const x of b.pos) if (x.t === "crm") crms[x.p] = t.crms[x.p] || x.crm || "";
  const ok = await storeBatchResults({ ...b, files }, { vals, crms }, inst, f, 0);
  return ok ? `${b.id} ${qcLabel(ok).toLowerCase()}` : `${b.id} not saved`;
}
/* A lab batch made from the report for samples in no batch of its kind yet. */

/* ---------- blind QA/QC re-assay (v20) ---------- */
/* Supervisors and admins pick samples already assayed, from Storage or the Ledger, for a blind check. Each pick becomes a new sample in the

   which this page reads for supervisors and admins only; the real server must refuse it to everyone else. Technicians receive, assay and
   release the blind sample like any other. Supervisors see its results beside the original's, on both records, and record the comparison in
   the same blind/ document, so nothing on either sample record (which technicians and the public lookup can read) gives the pair away. */

  if (!on) return;
  blindSub = db.collection("blind").onSnapshot(snap => {
    blinds.clear(); blindOf.clear();
    snap.docs.forEach(d => { const x = d.data(); if (x && x.id && x.of){ blinds.set(x.id, x); blindOf.set(x.of, [...(blindOf.get(x.of) || []), x.id]); } });

function qaSoon(){

/* The other record of a pair: the record open now, from the board when it is still in the lab, otherwise read and kept for 15 seconds. */
function qaDoc(id){

    if (a.t || a.calc) continue;

    const va = resNum(x), vb = resNum(y), both = va != null && vb != null;
    const d = both ? vb - va : null, m = both ? (va + vb) / 2 : 0, r = both ? (m ? Math.abs(d) / m * 100 : 0) : null;
    rows.push({ k: a.k, n: a.n, u: a.u || "", dp: a.dp, a: x ? resText(x, a) : "—", b: y ? resText(y, a) : "—", d, r, v: both ? qaJudge(o, a, va, vb) : null });

  if (p.dupAbs) return diff <= p.dupAbs + 1e-9 ? { c: "ok", t: `within ${fmtNum(p.dupAbs)} ${a.u}` } : { c: "bad", t: `outside ${fmtNum(p.dupAbs)} ${a.u}` };

  if (window.jsQR) return ok(window.jsQR);

/* What a scanned code points at: a tracking link (…#ID), or the code itself (a sample ID, batch reference or site sample code). */

    const h = t.indexOf("#");

    <div class="scan-view"><video id="scanVideo" playsinline muted></video><div class="scan-frame" aria-hidden="true"></div></div>
    <div class="small muted" id="scanStatus">Starting the camera (allow it if the browser asks)…</div>
    <form class="row" id="scanForm" autocomplete="off" style="gap:8px"><input class="inp" id="scanInput" placeholder="Or type the ID, or scan with a handheld scanner" style="flex:1 1 220px;width:auto" aria-label="Sample ID or label code"><button class="btn" type="submit">${multi ? "Add" : "Open"}</button></form>
    ${multi ? `<ul class="scan-log" id="scanLog" aria-live="polite"></ul>` : ""}
    ${hint ? `<div class="small muted">${esc(hint)}</div>` : ""}

/* ----- Turnaround (v24c): released on time or late against the route's promise from receipt, by section and by analysis. ----- */
function promisedAt(s){
  try {
    const p = planOf(s), r = p.findIndex(x => x.key === "received"), t = targetIdx(s), recv = s.recvAt || s.receivedAt;
    if (r < 0 || !recv || t <= r) return null;
    let clock = dueFrom(recv, p[r]);
    for (let j = r + 1; j <= t; j++){ const at = p[j].clock ? clock : workStart(clock); if (j === t) return at; clock = dueFrom(at, p[j]); }
    return clock;
  } catch { return null; }
}
const median = xs => { if (!xs.length) return null; const a = xs.slice().sort((x, y) => x - y), i = a.length >> 1; return a.length % 2 ? a[i] : (a[i - 1] + a[i]) / 2; };
function tatRows(list, keyOf, nameOf){
  const g = new Map();
  for (const s of list){
    const rel = s.relAt || lastCert(s)?.at, recv = s.recvAt || s.receivedAt, due = promisedAt(s); if (!rel || !recv) continue;
    const k = keyOf(s) || "—", x = g.get(k) || { k, name: nameOf(s) || k, n: 0, late: 0, tat: [] };
    x.n++; if (due && rel > due + 60000) x.late++; x.tat.push(rel - recv); g.set(k, x);
  }
  return [...g.values()].sort((a, b) => b.n - a.n || (a.name < b.name ? -1 : 1));
}
function turnaroundPanel(list){
  const all = tatRows(list, () => "all", () => "All"), tot = all[0];
  if (!tot) return "";
  const pct = x => x.n ? Math.round((x.n - x.late) / x.n * 100) : 0;
  const tbl = (head, rows) => `<div class="tbl-wrap"><table class="cardy tat-tbl"><thead><tr><th>${head}</th><th>Released</th><th>On time</th><th>Late</th><th>On time %</th><th>Median turnaround</th></tr></thead><tbody>${rows.map(x =>
    `<tr${x.late ? ' class="late"' : ""}><td>${esc(x.name)}</td><td>${x.n}</td><td>${x.n - x.late}</td><td>${x.late ? `<b style="color:var(--bad)">${x.late}</b>` : 0}</td><td><span class="pill ${pct(x) >= 90 ? "ok" : pct(x) >= 75 ? "warn" : "bad"}">${pct(x)}%</span></td><td>${esc(dur(median(x.tat) || 0))}</td></tr>`).join("")}</tbody></table></div>`;
  return `<details class="panel more-panel tat" id="tatBox"><summary><h3 style="display:inline">Turnaround</h3><span class="pill ${pct(tot) >= 90 ? "ok" : pct(tot) >= 75 ? "warn" : "bad"}">${tot.n - tot.late} of ${tot.n} on time (${pct(tot)}%)</span><span class="small muted">median ${esc(dur(median(tot.tat) || 0))} from receipt to release</span></summary>
    <div class="stack" style="gap:10px;margin-top:10px">
      ${tbl("Section", tatRows(list, s => s.section, s => s.section ? `${s.section} · ${sectionName(s.section) || ""}`.replace(/ · $/, "") : "—"))}
      ${tbl("Analysis", tatRows(list, s => s.test || s.route, s => testOf(s.test)?.name || s.testName || s.route))}
      <div class="small muted">On time: released by the time the route promised from receipt (lab working hours count; a re-assay counts against it).</div>
    </div></details>`;
}

/* ---------- v24d: a witness confirms from their own account (critical samples) ----------
   On a two-person custody sample (bullion, gravity concentrate, anything from the gold room or marked so) putting the retained material
   away and disposing of material are confirmed by the witness from their own account, the way a document is signed at two levels: the
   first person records it and names the witness (wq on the sample: what, who asked, who is asked, and wqU, the witness's username, to
   find it by); the witness opens the sample (its ID, a scan, or "Waiting for your confirmation" on the board) and confirms it, or sends
   it back with a reason. Until then the step stays open. The server accepts the confirmation only from the witness named, never from the
   person who asked. Other samples are not asked for this: their storage is complete once the material is on the shelf. */

  const m = (s.materials || []).find(x => x.k === q.k);
  return `${m ? m.item : "Material"} to be ${(DISPO[q.what] || q.what).toLowerCase()}${q.ref ? ` (${q.ref})` : ""}`;

async function doConfirm(){

    }
