<title>MET Lab Sample Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a control-room console. Lookup bar on top, tabbed work areas below, sample record as a job card with a stage rail. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2321; --muted:#5e6864; --line:#d9ddd9; --soft:#e8ebe8;
  --accent:#9a6b12; --accent-ink:#ffffff; --accent-soft:#f5ead2;
  --ok:#2f7d4f; --ok-soft:#e1f1e6; --warn:#a4570c; --warn-soft:#fbe9d6; --bad:#b3302a; --bad-soft:#f8e0de; --info:#2c5d7c; --info-soft:#dfeaf2;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1c211f; --ink:#e6e9e7; --muted:#9aa4a0; --line:#2f3633; --soft:#252b28;
  --accent:#d6a443; --accent-ink:#1a1405; --accent-soft:#3a2f17;
  --ok:#6cc48f; --ok-soft:#1d3326; --warn:#e8a25a; --warn-soft:#3a2a17; --bad:#ef7d75; --bad-soft:#3d1f1d; --info:#7fb4d6; --info-soft:#1c2d38;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1c211f; --ink:#e6e9e7; --muted:#9aa4a0; --line:#2f3633; --soft:#252b28;
  --accent:#d6a443; --accent-ink:#1a1405; --accent-soft:#3a2f17;
  --ok:#6cc48f; --ok-soft:#1d3326; --warn:#e8a25a; --warn-soft:#3a2a17; --bad:#ef7d75; --bad-soft:#3d1f1d; --info:#7fb4d6; --info-soft:#1c2d38;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;letter-spacing:.01em}
h2{font-size:21px}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.who{font-size:13px;color:var(--muted)}

.lookup{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.lookup input{flex:1 1 260px;min-width:0;font-family:var(--f-mono);font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--panel)}
.lookup input:focus{border-color:var(--accent);outline:none}
.lookup input::placeholder{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:12px 20px;font-size:16px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

nav.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--f-mono);font-size:12px;background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:4px}
section.view{padding-top:20px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--ink);font-size:14px}
.notice.warn{background:var(--warn-soft)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:6px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--accent-soft);color:var(--accent)}

/* Job card */
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-start}
.sid{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.03em}
.eta{background:var(--soft);border-radius:var(--r);padding:12px 16px;min-width:220px}
.eta .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.eta .val{font-family:var(--f-display);font-size:22px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px;padding-top:1px}
dl.facts dd{margin:0;overflow-wrap:anywhere}

ol.rail{list-style:none;margin:0;padding:0}
ol.rail li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding-bottom:14px}
ol.rail li:last-child{padding-bottom:0}
ol.rail li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--line)}
ol.rail li:last-child::before{display:none}
ol.rail li.done::before{background:var(--ok)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;z-index:1}
li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--panel)}
li.current .dot{border-color:var(--accent);background:var(--accent-soft)}
li.current .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
li.current.late .dot{border-color:var(--bad);background:var(--bad-soft)}
li.current.late .dot::after{background:var(--bad)}
.st-name{font-weight:600}
li.upcoming .st-name{color:var(--muted);font-weight:500}
.st-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.hist li:first-child{border-top:0}
.hist time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

.actions{border-top:1px dashed var(--line);margin-top:4px;padding-top:16px}

/* Forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .req{color:var(--bad)}
.f input,.f select,.f textarea,.inp{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-weight:400;color:var(--ink);font-size:15px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--accent);outline:none}
fieldset{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400;color:var(--ink);font-size:14px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* Board */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lane{background:var(--soft);border-radius:var(--r);padding:10px;min-width:0}
.lane h4{margin:0 0 8px;font-family:var(--f-display);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.lane h4 span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;padding:7px 9px;margin-top:6px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip.late{border-left-color:var(--bad)}
.chip.urgent{border-left-color:var(--accent)}
.chip .cid{font-family:var(--f-mono);font-size:13px;font-weight:600}
.chip .cmeta{font-size:12px;color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft);white-space:nowrap}
td{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td .linkish{background:none;border:0;padding:0;font-family:var(--f-mono);font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.dir-in{color:var(--ok);font-weight:700}
.dir-out{color:var(--info);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:10;max-width:calc(100% - 32px)}
.label-strip{display:flex;flex-wrap:wrap;gap:6px}
.label-strip code{font-family:var(--f-mono);background:var(--soft);padding:3px 8px;border-radius:4px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .15s,filter .15s}}
/* Sign-in screen */
.login-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:760px){.login-grid{grid-template-columns:minmax(0,1fr)}}
.mock{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--warn);border-radius:var(--r);background:var(--warn-soft);font-size:13px}
.mock b{white-space:nowrap}
.demo-list{display:grid;gap:8px}
.demo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.demo .r{font-size:12px;color:var(--muted)}
.demo code{font-family:var(--f-mono);font-size:13px}
.role-chip{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.me-box{display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--soft);font-weight:600;color:var(--ink);font-size:15px}
/* Workflow routes */
.code{font-family:var(--f-mono);font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px;white-space:nowrap}
.route-box{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
ol.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
ol.steps li{font-size:13px;background:var(--soft);border-radius:4px;padding:3px 8px;border-left:3px solid var(--line)}
ol.steps li span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.ph-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:4px;background:var(--soft);border-left:3px solid var(--line);white-space:nowrap}
.ph-intake{border-left-color:var(--info)!important}
.ph-prep{border-left-color:var(--warn)!important}
.ph-test{border-left-color:var(--accent)!important}
.ph-qc{border-left-color:var(--ok)!important}
.ph-await,.ph-report,.ph-store{border-left-color:var(--muted)!important}
.lane{border-top:3px solid var(--line)}
.lane.ph-intake{border-top-color:var(--info)} .lane.ph-prep{border-top-color:var(--warn)} .lane.ph-test{border-top-color:var(--accent)} .lane.ph-qc{border-top-color:var(--ok)}
.chip .rc{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:600;margin-left:4px}
details.route{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.route>summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
details.route[open]>summary{border-bottom:1px solid var(--line)}
details.route .body{padding:14px;display:flex;flex-direction:column;gap:12px}
td.note{color:var(--muted);font-size:13px;min-width:220px}
ul.tight{margin:4px 0 0;padding-left:18px}
.subtle{font-size:13px;color:var(--muted)}
.st-note{font-size:13px;color:var(--muted);margin-top:2px}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more>summary{cursor:pointer;font-weight:600;font-size:14px}
.cat-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 12px;align-items:start}
@media (max-width:640px){.cat-row{grid-template-columns:minmax(0,1fr)}}
.cat-name{font-weight:600;font-size:14px;padding-top:3px}
.cat-tests{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font:inherit;font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--ink);text-align:left}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Mine site → Metallurgical laboratory</small>
      <h1>MET Lab Sample Tracker</h1>
    </div>
    <div class="row" style="gap:8px"><span class="pill" title="Design prototype">Prototype</span><span class="pill warn" id="sync">Connecting…</span><span class="who" id="who"></span><button class="btn" id="signBtn" type="button" hidden>Sign out</button></div>
  </header>

  <form class="lookup" id="lookupForm" autocomplete="off">
    <input id="lookupInput" placeholder="Enter sample ID or tag number" aria-label="Sample ID">
    <button class="btn primary big" type="submit">Track sample</button>
  </form>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="track" aria-selected="true">Sample record</button>
    <button role="tab" data-tab="board" aria-selected="false">Workflow board <span class="count" id="cntActive">0</span></button>
    <button role="tab" data-tab="submit" aria-selected="false">Submit a sample</button>
    <button role="tab" data-tab="register" aria-selected="false">Register at lab</button>
    <button role="tab" data-tab="ledger" aria-selected="false">In / out ledger</button>
    <button role="tab" data-tab="routes" aria-selected="false">Workflow routes</button>
    <button role="tab" data-tab="stages" aria-selected="false">Settings</button>
    <button role="tab" data-tab="login" aria-selected="false">Staff sign in</button>
  </nav>

  <section class="view" id="view-login" hidden></section>
  <section class="view" id="view-track" hidden></section>
  <section class="view" id="view-board" hidden></section>
  <section class="view" id="view-submit" hidden></section>
  <section class="view" id="view-register" hidden></section>
  <section class="view" id="view-ledger" hidden></section>
  <section class="view" id="view-routes" hidden></section>
  <section class="view" id="view-stages" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const SHARE_URL = "https://claude.ai/artifact/5JgoyE2wokT67u8TCtYDop";
document.addEventListener("click", e => {
  const b = e.target.closest("[data-link]"); if (!b) return;
  const url = SHARE_URL + "#" + b.dataset.link;
  navigator.clipboard.writeText(url).then(() => toast("Tracking link copied"), () => toast(url));
});
const HOUR = 3600e3;
