<title>MET Lab Sample Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a control-room console. Lookup bar on top, tabbed work areas below, sample record as a job card with a stage rail. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1d2321; --muted:#5e6864; --line:#d9ddd9; --soft:#e8ebe8;
  --accent:#9a6b12; --accent-ink:#ffffff; --accent-soft:#f5ead2;
  --ok:#2f7d4f; --ok-soft:#e1f1e6; --warn:#a4570c; --warn-soft:#fbe9d6; --bad:#b3302a; --bad-soft:#f8e0de; --info:#2c5d7c; --info-soft:#dfeaf2;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1c211f; --ink:#e6e9e7; --muted:#9aa4a0; --line:#2f3633; --soft:#252b28;
  --accent:#d6a443; --accent-ink:#1a1405; --accent-soft:#3a2f17;
  --ok:#6cc48f; --ok-soft:#1d3326; --warn:#e8a25a; --warn-soft:#3a2a17; --bad:#ef7d75; --bad-soft:#3d1f1d; --info:#7fb4d6; --info-soft:#1c2d38;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1c211f; --ink:#e6e9e7; --muted:#9aa4a0; --line:#2f3633; --soft:#252b28;
  --accent:#d6a443; --accent-ink:#1a1405; --accent-soft:#3a2f17;
  --ok:#6cc48f; --ok-soft:#1d3326; --warn:#e8a25a; --warn-soft:#3a2a17; --bad:#ef7d75; --bad-soft:#3d1f1d; --info:#7fb4d6; --info-soft:#1c2d38;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;letter-spacing:.01em}
h2{font-size:21px}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.who{font-size:13px;color:var(--muted)}

.lookup{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.lookup input{flex:1 1 260px;min-width:0;font-family:var(--f-mono);font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r);background:var(--panel)}
.lookup input:focus{border-color:var(--accent);outline:none}
.lookup input::placeholder{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:12px 20px;font-size:16px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

nav.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--f-mono);font-size:12px;background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:4px}
section.view{padding-top:20px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--info-soft);color:var(--ink);font-size:14px}
.notice.warn{background:var(--warn-soft)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:6px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--accent-soft);color:var(--accent)}

/* Job card */
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-start}
.sid{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.03em}
.eta{background:var(--soft);border-radius:var(--r);padding:12px 16px;min-width:220px}
.eta .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.eta .val{font-family:var(--f-display);font-size:22px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px;padding-top:1px}
dl.facts dd{margin:0;overflow-wrap:anywhere}

ol.rail{list-style:none;margin:0;padding:0}
ol.rail li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding-bottom:14px}
ol.rail li:last-child{padding-bottom:0}
ol.rail li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--line)}
ol.rail li:last-child::before{display:none}
ol.rail li.done::before{background:var(--ok)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;z-index:1}
li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--panel)}
li.current .dot{border-color:var(--accent);background:var(--accent-soft)}
li.current .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
li.current.late .dot{border-color:var(--bad);background:var(--bad-soft)}
li.current.late .dot::after{background:var(--bad)}
.st-name{font-weight:600}
li.upcoming .st-name{color:var(--muted);font-weight:500}
.st-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.hist li:first-child{border-top:0}
.hist time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

.actions{border-top:1px dashed var(--line);margin-top:4px;padding-top:16px}

/* Forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .req{color:var(--bad)}
.f input,.f select,.f textarea,.inp{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-weight:400;color:var(--ink);font-size:15px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--accent);outline:none}
fieldset{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400;color:var(--ink);font-size:14px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.legend{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* Board */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lane{background:var(--soft);border-radius:var(--r);padding:10px;min-width:0}
.lane h4{margin:0 0 8px;font-family:var(--f-display);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.lane h4 span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;padding:7px 9px;margin-top:6px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip.late{border-left-color:var(--bad)}
.chip.urgent{border-left-color:var(--accent)}
.chip .cid{font-family:var(--f-mono);font-size:13px;font-weight:600}
.chip .cmeta{font-size:12px;color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft);white-space:nowrap}
td{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td .linkish{background:none;border:0;padding:0;font-family:var(--f-mono);font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.dir-in{color:var(--ok);font-weight:700}
.dir-out{color:var(--info);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:10;max-width:calc(100% - 32px)}
.label-strip{display:flex;flex-wrap:wrap;gap:6px}
.label-strip code{font-family:var(--f-mono);background:var(--soft);padding:3px 8px;border-radius:4px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .15s,filter .15s}}
/* Sign-in screen */
.login-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:760px){.login-grid{grid-template-columns:minmax(0,1fr)}}
.mock{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--warn);border-radius:var(--r);background:var(--warn-soft);font-size:13px}
.mock b{white-space:nowrap}
.demo-list{display:grid;gap:8px}
.demo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.demo .r{font-size:12px;color:var(--muted)}
.demo code{font-family:var(--f-mono);font-size:13px}
.role-chip{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.me-box{display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--soft);font-weight:600;color:var(--ink);font-size:15px}
/* Workflow routes */
.code{font-family:var(--f-mono);font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px;white-space:nowrap}
.route-box{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
ol.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
ol.steps li{font-size:13px;background:var(--soft);border-radius:4px;padding:3px 8px;border-left:3px solid var(--line)}
ol.steps li span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.ph-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:4px;background:var(--soft);border-left:3px solid var(--line);white-space:nowrap}
.ph-intake{border-left-color:var(--info)!important}
.ph-prep{border-left-color:var(--warn)!important}
.ph-test{border-left-color:var(--accent)!important}
.ph-qc{border-left-color:var(--ok)!important}
.ph-await,.ph-report,.ph-store{border-left-color:var(--muted)!important}
.lane{border-top:3px solid var(--line)}
.lane.ph-intake{border-top-color:var(--info)} .lane.ph-prep{border-top-color:var(--warn)} .lane.ph-test{border-top-color:var(--accent)} .lane.ph-qc{border-top-color:var(--ok)}
.chip .rc{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:600;margin-left:4px}
details.route{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.route>summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
details.route[open]>summary{border-bottom:1px solid var(--line)}
details.route .body{padding:14px;display:flex;flex-direction:column;gap:12px}
td.note{color:var(--muted);font-size:13px;min-width:220px}
ul.tight{margin:4px 0 0;padding-left:18px}
.subtle{font-size:13px;color:var(--muted)}
.st-note{font-size:13px;color:var(--muted);margin-top:2px}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more>summary{cursor:pointer;font-weight:600;font-size:14px}
.cat-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 12px;align-items:start}
@media (max-width:640px){.cat-row{grid-template-columns:minmax(0,1fr)}}
.cat-name{font-weight:600;font-size:14px;padding-top:3px}
.cat-tests{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font:inherit;font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--ink);text-align:left}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Mine site → Metallurgical laboratory</small>
      <h1>MET Lab Sample Tracker</h1>
    </div>
    <div class="row" style="gap:8px"><span class="pill" title="Design prototype">Prototype</span><span class="pill warn" id="sync">Connecting…</span><span class="who" id="who"></span><button class="btn" id="signBtn" type="button" hidden>Sign out</button></div>
  </header>

  <form class="lookup" id="lookupForm" autocomplete="off">
    <input id="lookupInput" placeholder="Enter sample ID or tag number" aria-label="Sample ID">
    <button class="btn primary big" type="submit">Track sample</button>
  </form>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="track" aria-selected="true">Sample record</button>
    <button role="tab" data-tab="board" aria-selected="false">Workflow board <span class="count" id="cntActive">0</span></button>
    <button role="tab" data-tab="submit" aria-selected="false">Submit a sample</button>
    <button role="tab" data-tab="register" aria-selected="false">Register at lab</button>
    <button role="tab" data-tab="ledger" aria-selected="false">In / out ledger</button>
    <button role="tab" data-tab="routes" aria-selected="false">Workflow routes</button>
    <button role="tab" data-tab="stages" aria-selected="false">Settings</button>
    <button role="tab" data-tab="login" aria-selected="false">Staff sign in</button>
  </nav>

  <section class="view" id="view-login" hidden></section>
  <section class="view" id="view-track" hidden></section>
  <section class="view" id="view-board" hidden></section>
  <section class="view" id="view-submit" hidden></section>
  <section class="view" id="view-register" hidden></section>
  <section class="view" id="view-ledger" hidden></section>
  <section class="view" id="view-routes" hidden></section>
  <section class="view" id="view-stages" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const SHARE_URL = "https://claude.ai/artifact/5JgoyE2wokT67u8TCtYDop";
document.addEventListener("click", e => {
  const b = e.target.closest("[data-link]"); if (!b) return;
  const url = SHARE_URL + "#" + b.dataset.link;
  navigator.clipboard.writeText(url).then(() => toast("Tracking link copied"), () => toast(url));
});
const HOUR = 3600e3;

/* Default settings. Admins change accounts, sections and workflow routes on the "Settings" tab; they are saved to settings/stages. */
/* ROUTES-BEGIN: sample types, tests, purposes and the default workflow routes. Admins edit routes on the Settings tab. */
const S = (key, name, hours, phase, note = "", redo = false) => ({ key, name, hours, phase, note, ...(redo ? { redo: true } : {}) });
const PURPOSES = [
  { key: "exp",     name: "Exploration / resource definition" },
  { key: "gc",      name: "Grade control (ore / waste)" },
  { key: "plant",   name: "Plant process control" },
  { key: "recon",   name: "Mine-to-mill reconciliation" },
  { key: "met",     name: "Metallurgical testwork / process design" },
  { key: "bullion", name: "Bullion / export settlement" },
  { key: "env",     name: "Environmental compliance" },
  { key: "hse",     name: "Health & safety / occupational hygiene" },
  { key: "qc",      name: "Quality control / check assay" },
  { key: "other",   name: "Other" }
];
/* Test catalogue, grouped the way a mine assay lab groups its work. */
const TEST_CATS = ["Gold assay", "Leach & recovery testwork", "Gravity & flotation", "Physical & comminution", "Chemistry & mineralogy", "Plant & gold room", "Environment & cyanide"];
const TESTS = [
  { key: "fa_aas",       cat: "Gold assay", name: "Gold by fire assay, AAS finish" },
  { key: "fa_grav",      cat: "Gold assay", name: "Gold by fire assay, gravimetric finish (high grade)" },
  { key: "sfa",          cat: "Gold assay", name: "Screen fire assay (coarse / nuggety gold)" },
  { key: "ar_au",        cat: "Gold assay", name: "Low-level gold by aqua regia / BLEG (soils, sediments)" },
  { key: "check",        cat: "Gold assay", name: "Check / umpire assay (external lab)" },
  { key: "cn_sol",       cat: "Leach & recovery testwork", name: "Cyanide-soluble gold (LeachWELL)" },
  { key: "bottle",       cat: "Leach & recovery testwork", name: "Bottle roll cyanidation test" },
  { key: "cil_test",     cat: "Leach & recovery testwork", name: "CIL / CIP leach test with carbon" },
  { key: "pri",          cat: "Leach & recovery testwork", name: "Preg-robbing test (gold-rob test, PRI)" },
  { key: "diag",         cat: "Leach & recovery testwork", name: "Diagnostic leach (gold deportment)" },
  { key: "reagent",      cat: "Leach & recovery testwork", name: "Cyanide & lime consumption (reagent optimisation)" },
  { key: "o2",           cat: "Leach & recovery testwork", name: "Oxygen uptake rate test" },
  { key: "column",       cat: "Leach & recovery testwork", name: "Column / heap leach with agglomeration" },
  { key: "ilr",          cat: "Leach & recovery testwork", name: "Intensive leach test (gravity concentrate)" },
  { key: "grg",          cat: "Gravity & flotation", name: "Gravity recoverable gold (GRG)" },
  { key: "flot",         cat: "Gravity & flotation", name: "Flotation test (rougher / cleaner kinetics)" },
  { key: "commin",       cat: "Physical & comminution", name: "Comminution & abrasion (SMC, BWi, RWi, Ai)" },
  { key: "density",      cat: "Physical & comminution", name: "Specific gravity & bulk density" },
  { key: "psd",          cat: "Physical & comminution", name: "Particle size distribution" },
  { key: "moisture",     cat: "Physical & comminution", name: "Moisture content" },
  { key: "settle",       cat: "Physical & comminution", name: "Settling & rheology (thickener, flocculant)" },
  { key: "icp",          cat: "Chemistry & mineralogy", name: "Multi-element ICP" },
  { key: "delet",        cat: "Chemistry & mineralogy", name: "Deleterious & cyanicide elements (Cu, As, Sb, Hg…)" },

const $ = (s, el = document) => el.querySelector(s);
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
function fmt(ms){ if (!ms) return "—"; return new Date(ms).toLocaleString(undefined, { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }); }
function fmtDate(ms){ return ms ? new Date(ms).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" }) : "—"; }
function dur(ms){
  const neg = ms < 0; ms = Math.abs(ms);
  const d = Math.floor(ms / 86400e3), h = Math.floor(ms % 86400e3 / HOUR), m = Math.floor(ms % HOUR / 60000);
  const s = d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
  return neg ? `${s} ago` : s;
}
function hoursLabel(h){ h = +h || 0; if (h >= 48) return `${+(h/24).toFixed(1)} days`; return `${+h.toFixed(2)} h`; }
function normId(s){
  const v = String(s || "").trim().toUpperCase().replace(/\s+/g, "");
  let m = v.match(/^([A-Z]{1,6})-?(\d{8})-?(\d{1,6})$/);          // EXP-20261013-0001
  if (m) return `${m[1]}-${m[2]}-${m[3].padStart(4, "0")}`;
  m = v.match(/^([A-Z]{1,6})-?(\d{4})-?(\d{1,5})$/);              // early format EXP-2026-00001
  return m ? `${m[1]}-${m[2]}-${m[3].padStart(5, "0")}` : v;
}
function dayStamp(ms){ const d = new Date(ms); return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`; }
function splitTags(t){ return String(t || "").split(/[,;\n]+/).map(x => x.trim()).filter(Boolean); }
const sectionName = code => (cfg.sections || []).find(x => x.code === code)?.name || code || "";

/* ---------- workflow maths: each sample carries its own plan, built from its route ---------- */
const typeOf = k => TYPES.find(t => t.key === k) || null;
const testOf = k => TESTS.find(t => t.key === k) || null;
const purposeOf = k => PURPOSES.find(p => p.key === k) || null;
const routeByCode = c => (cfg.routes || []).find(r => r.code === c) || null;
/* Saved routes plus any default route the admin has not removed, so routes added in later versions still appear. */
function mergeRoutes(saved, removed){
  if (!Array.isArray(saved) || !saved.length) return clone(DEFAULT_ROUTES);
  const have = new Set(saved.map(r => r.code)), gone = new Set(removed || []);
  return [...clone(saved), ...clone(DEFAULT_ROUTES.filter(r => !have.has(r.code) && !gone.has(r.code)))];
}
const testRank = r => { const i = TESTS.findIndex(t => t.key === (r.tests || [])[0]); return i < 0 ? 999 : i; };
const routeCat = r => testOf((r.tests || [])[0])?.cat || "Other";
/* Recommended test for a sample type; the purpose can steer it (testwork, environmental, plant). */
function defaultTest(typeKey, purposeKey){
  const list = typeOf(typeKey)?.tests || ["fa_aas"];
  const pref = { met: ["bottle", "cil_test", "pri", "grg", "diag", "commin", "cn_sol"], env: ["water", "soil", "tsf", "aba"], hse: ["water", "soil"], qc: ["check"],
    plant: ["plant_solids", "ccd", "eluate", "residue", "cil_survey", "carbon", "solution"], bullion: ["bullion"] }[purposeKey] || [];
  return pref.find(x => list.includes(x)) || list[0];
}
/* The route must perform the test; among those, a purpose match counts most, then a sample-type match. */
function routeFor(typeKey, testKey, purposeKey){
  let best = null, score = -1;
  for (const r of cfg.routes || []){
    if (!(r.tests || []).includes(testKey)) continue;
    const ty = r.types || [];
    const s = ((r.purposes || []).includes(purposeKey) ? 3 : 0) + (ty.includes(typeKey) ? 2 : ty.includes("*") || !ty.length ? 1 : 0);
    if (s > score){ best = r; score = s; }
  }
  return best || (cfg.routes || [])[0] || null;
}
const keepDays = r => Math.max(0, ...((r && r.retention) || []).map(x => +x.days || 0));
function buildPlan(r){
  return [...HEAD.map(x => ({ ...x })),
    ...((r && r.stages) || []).map(x => ({ key: x.key, name: x.name, hours: +x.hours || 0, phase: x.phase || "test", ...(x.redo ? { redo: true } : {}) })),
    { key: "released", name: "Results released", hours: 1, phase: "report", target: true },
    { key: "storage", name: "Retained in storage", hours: Math.max(1, keepDays(r)) * 24, phase: "store" }];
}
/* Hours from receipt to results for a route. */
const routeTat = r => HEAD[1].hours + ((r && r.stages) || []).reduce((t, x) => t + (+x.hours || 0), 0);
function routeFields(r, s){
  const test = (r.tests || []).includes(s.test) ? s.test : (r.tests || [])[0] || s.test || "";
  return { route: r.code, routeName: r.name, test, testName: testOf(test)?.name || "", plan: buildPlan(r), retention: clone(r.retention || []) };
}
const planOf = s => (s && Array.isArray(s.plan) && s.plan.length) ? s.plan : LEGACY_PLAN;
const allOf = s => [...planOf(s), ...FINALS];
const stage = (s, key) => allOf(s).find(x => x.key === key) || null;
const stageIdx = (s, key) => allOf(s).findIndex(x => x.key === key);
const targetIdx = s => { const p = planOf(s), i = p.findIndex(x => x.target); return i < 0 ? p.length - 1 : i; };
/* Where a re-assay sends the sample back to: the step marked in the route, else its first analysis step. */
const redoIdx = s => { const p = planOf(s); const i = p.findIndex(x => x.redo); return i >= 0 ? i : p.findIndex(x => x.phase === "test"); };
const stageName = (s, h) => stage(s, h.key)?.name || h.sn || h.key;
const routeStageNote = (s, key) => routeByCode(s.route)?.stages?.find(x => x.key === key)?.note || "";
function lastEntry(s, key){ const h = s.history || []; for (let i = h.length - 1; i >= 0; i--) if (h[i].key === key) return h[i]; return null; }
function stageDue(s){ const st = stage(s, s.stageKey); return st && !st.final ? s.stageAt + st.hours * HOUR : null; }
const awaiting = s => s.stageKey === "submitted";
function status(s){
  const st = stage(s, s.stageKey), i = stageIdx(s, s.stageKey), t = targetIdx(s), now = Date.now();
  if (!st) return { label: "Unknown stage", cls: "", closed: false, late: false };
  if (st.final) return { label: st.name, cls: s.stageKey === "rejected" ? "bad" : "", closed: true, late: false };
  const due = stageDue(s), late = due && now > due;
  if (awaiting(s)) return { label: s.flag ? "Flagged at receipt" : late ? "Not yet received (overdue)" : "Awaiting receipt at lab", cls: s.flag || late ? "warn" : "info", closed: false, late };
  if (i > t) return { label: late ? "Past retention, due for disposal" : st.name, cls: late ? "warn" : "info", closed: false, late, post: true };
  if (i === t) return { label: st.name, cls: "ok", closed: false, late: false, post: true };
  return { label: late ? `Overdue at ${st.name}` : `In progress: ${st.name}`, cls: late ? "bad" : "gold", closed: false, late };
}
/* Projected start time of every stage up to and including results released. */
function projection(s){
  const p = planOf(s), i = p.findIndex(x => x.key === s.stageKey), t = targetIdx(s), out = {};
  if (i < 0 || i >= t) return { out, eta: null };
  let clock = Math.max(s.stageAt + p[i].hours * HOUR, Date.now());
  for (let j = i + 1; j <= t; j++){ out[p[j].key] = clock; clock += p[j].hours * HOUR; }
  return { out, eta: out[p[t].key] };
}
function daysLabel(d){
  d = +d || 0;
  if (d === 365) return "12 months";
  if (d >= 30 && d % 30 === 0) return `${d / 30} month${d === 30 ? "" : "s"}`;
  if (d >= 7 && d % 7 === 0) return `${d / 7} week${d === 7 ? "" : "s"}`;
  return `${d} day${d === 1 ? "" : "s"}`;
}
const lcFirst = t => String(t || "").charAt(0).toLowerCase() + String(t || "").slice(1);
const retentionLine = x => +x.days ? `${x.item}: kept ${daysLabel(x.days)} after results, then ${lcFirst(x.then)}` : `${x.item}: ${lcFirst(x.then)}`;
const routeOptions = sel => (cfg.routes || []).map(r => `<option value="${esc(r.code)}" ${r.code === sel ? "selected" : ""}>${esc(r.code)} · ${esc(r.name)}</option>`).join("");
const routeLine = r => r ? `${r.stages.length} lab steps; results about ${hoursLabel(routeTat(r))} after receipt.` : "";
function routePreview(r){
  return `<div class="route-box">
    <div class="row" style="gap:8px"><span class="code">${esc(r.code)}</span><b>${esc(r.name)}</b></div>
    ${r.desc ? `<div class="small muted">${esc(r.desc)}</div>` : ""}
    <ol class="steps">${[HEAD[1], ...r.stages].map(x => `<li class="ph-${esc(x.phase)}">${esc(x.name)}<span>${hoursLabel(x.hours)}</span></li>`).join("")}<li class="ph-report">Results released</li></ol>
    <div class="small">Results about <b>${hoursLabel(routeTat(r))}</b> after the lab receives the sample. ${(r.retention || []).length ? `Retention: ${esc(r.retention.map(retentionLine).join("; "))}.` : ""}</div></div>`;
}

/* ---------- tabs ---------- */
function lsGet(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } }
function lsSet(k, v){ try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
function allowedTabs(){ return session ? ROLE_TABS[session.role] || ["track"] : ["submit", "track", "routes", "login"]; }
function updateChrome(){
  const tabs = allowedTabs();
  document.querySelectorAll("#tabs button").forEach(b => { b.hidden = !tabs.includes(b.dataset.tab); b.style.order = !session && b.dataset.tab === "submit" ? -1 : ""; });
  $("#who").textContent = session ? `${session.name} · ${ROLES[session.role]}` : "Not signed in";
  $("#signBtn").hidden = !session;
  $("#signBtn").textContent = "Sign out";
}
function resolveSession(){
  const u = session?.u || lsGet("session");
  const acct = u && (cfg.users || []).find(x => x.u === u);
  session = acct ? { u: acct.u, name: acct.name, role: acct.role } : null;
  if (!session) lsSet("session", "");
  if (!allowedTabs().includes(tab)) tab = session ? "board" : "submit";
  updateChrome();
}
$("#signBtn").addEventListener("click", () => {
  if (session){ session = null; lsSet("session", ""); updateChrome(); setTab("login"); toast("Signed out"); }
  else setTab("login");
});
function setTab(t){
  if (!allowedTabs().includes(t)) t = session ? "board" : "submit";
  tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  document.querySelectorAll("section.view").forEach(v => v.hidden = v.id !== "view-" + t);
  renderTab();
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
function renderTab(){
  ({ login: renderLogin, track: renderTrack, board: renderBoard, submit: renderSubmit, register: renderRegister, ledger: renderLedger, routes: renderRoutes, stages: renderStages })[tab]();
  const active = [...samples.values()].filter(s => !status(s).closed).length;
  $("#cntActive").textContent = active;
}

  if ($("#loginForm", v) && v.contains(document.activeElement)) return; // don't wipe what someone is typing
  const keepU = $("#lgUser", v)?.value || "";
  v.innerHTML = `<div class="login-grid">
    <form class="panel stack" id="loginForm" autocomplete="off">
      <div><h2>Staff sign in</h2><p class="small muted" style="margin:4px 0 0">Lab technicians sign in to confirm receipt of samples and record each stage. Admins also manage workflow routes, sections and accounts.</p></div>
      <label class="f"><span>Username</span><input id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="f"><span>Password</span><input id="lgPass" type="password" autocomplete="current-password"></label>
      <div class="row"><button class="btn primary big" type="submit">Sign in</button><span class="small" id="lgErr" style="color:var(--bad)"></span></div>
      <p class="small muted" style="margin:0">No account is needed to submit a sample or follow one: use <button type="button" class="btn ghost small" data-goto="submit">Submit a sample</button> or type an ID or tag number in the box above.</p>
    </form>
    <div class="panel stack">

      <div class="demo-list">${(cfg.users || []).slice(0, 12).map(x => `<div class="demo">
        <div><div class="role-chip">${esc(ROLES[x.role] || x.role)}</div><div><b>${esc(x.name)}</b></div>
          <div class="r">Username <code>${esc(x.u)}</code> · Password <code>${esc(x.pw)}</code></div></div>
        <button class="btn" type="button" data-demo="${esc(x.u)}">Use</button></div>`).join("")}</div>
    </div></div>`;
  $("#lgUser").value = keepU;
  $("#loginForm").addEventListener("submit", e => { e.preventDefault(); signIn($("#lgUser").value, $("#lgPass").value); });
  v.querySelectorAll("[data-demo]").forEach(b => b.onclick = () => {
    const acct = (cfg.users || []).find(x => x.u === b.dataset.demo);
    if (acct){ $("#lgUser").value = acct.u; $("#lgPass").value = acct.pw; $("#lgPass").focus(); }
  });
}
function signIn(u, pw){
  u = String(u || "").trim().toLowerCase();
  const acct = (cfg.users || []).find(x => x.u.toLowerCase() === u && x.pw === pw);
  if (!acct){ $("#lgErr").textContent = "Username or password is wrong."; return; }
  session = { u: acct.u, name: acct.name, role: acct.role };
  lsSet("session", acct.u);
  updateChrome();
  toast(`Signed in as ${acct.name}`);
  setTab(current ? "track" : "board");
}

/* ---------- lookup ---------- */
$("#lookupForm").addEventListener("submit", e => { e.preventDefault(); openSample($("#lookupInput").value); });
document.addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b){ e.preventDefault(); openSample(b.dataset.open); } });

function openSample(raw){
  let id = normId(raw);
  if (!id) return;
  // Accept a tag number or site reference too, when it matches a loaded sample.
  if (!samples.has(id)){
    const raw2 = String(raw).trim().toUpperCase();
    const hit = [...samples.values()].find(s => String(s.tagNo || "").toUpperCase() === raw2 || String(s.siteRef || "").toUpperCase() === raw2);
    if (hit) id = hit.id;
  }
  $("#lookupInput").value = id;
  try { history.replaceState(null, "", "#" + id.replace(/[^A-Za-z0-9._~-]/g, "")); } catch {}
  if (unsubCurrent){ unsubCurrent(); unsubCurrent = null; }
  current = { id, body: samples.get(id) || null, missing: false, loading: !samples.has(id) };
  setTab("track");
  if (!db) return;
  let ref;
  try { ref = db.doc("samples/" + id); } catch { current = { id, body: null, missing: true }; renderTrack(); return; }
  unsubCurrent = ref.onSnapshot(snap => {
    if (!current || current.id !== id) return;
    current = { id, body: snap.exists ? snap.data() : null, missing: !snap.exists, loading: false };
    if (tab === "track") renderTrack();
  }, () => {});
}

/* ---------- sample record ---------- */
function renderTrack(){
  const v = $("#view-track");
  if (!current){
    v.innerHTML = `<div class="panel empty">
      <strong>Enter a sample ID to see where it is</strong>
      Every sample gets an ID like <span class="mono">${esc(exampleId())}</span> when it is submitted: the section that sent it, the submission date, then a running number. You can also type the sample's tag number.
      Type it above to see the sample type, who submitted it, the test and its workflow route, the current stage and when results are expected.
      <div class="row" style="justify-content:center;margin-top:16px">
        ${session ? `<button class="btn" data-goto="board">Open workflow board</button>` : `<button class="btn" data-goto="login">Staff sign in</button>`}
        <button class="btn primary" data-goto="submit">Submit a sample</button>
      </div></div>`;
    return;
  }
  if (current.loading && !current.body){ v.innerHTML = `<div class="panel empty"><strong>Looking up ${esc(current.id)}…</strong></div>`; return; }
  if (!current.body){
    v.innerHTML = `<div class="panel empty"><strong>No sample found with ID ${esc(current.id)}</strong>
      Check the ID on the bag or submission form. IDs look like <span class="mono">${esc(exampleId())}</span>: section code, submission date, running number. A tag number also works once the sample is registered.
      ${db ? "" : "<br>The shared register is not connected in this view, so lookups cannot run."}</div>`;
    return;
  }
  const s = current.body, st = status(s), proj = projection(s), now = Date.now(), plan = planOf(s), r = routeByCode(s.route);
  const tIdx = targetIdx(s), released = lastEntry(s, plan[tIdx].key);
  let etaHtml;
  if (st.closed) etaHtml = `<div class="lbl">Closed</div><div class="val">${esc(stage(s, s.stageKey)?.name || "")}</div><div class="small muted">${fmt(s.stageAt)}</div>`;
  else if (proj.eta) etaHtml = `<div class="lbl">Results expected</div><div class="val">${fmt(proj.eta)}</div><div class="small muted">in ${dur(proj.eta - now)}${st.late ? " · current stage is running late" : ""}</div>`;
  else etaHtml = `<div class="lbl">Results released</div><div class="val">${fmt(released ? released.at : s.stageAt)}</div><div class="small muted">Turnaround ${dur((released ? released.at : s.stageAt) - (lastEntry(s, "received")?.at || s.createdAt))}</div>`;

  // Stage rail: this sample's own route, plus the closing step if it reached one.
  const curI = stageIdx(s, s.stageKey);
  const firstI = Math.min(...(s.history || []).map(h => stageIdx(s, h.key)).filter(i => i >= 0), curI >= 0 ? curI : 0);
  const railStages = [...plan.filter((x, i) => i >= firstI), ...FINALS.filter(x => x.key === s.stageKey)];
  const rail = railStages.map(x => {
    const i = stageIdx(s, x.key), e = lastEntry(s, x.key);
    let cls = "upcoming", meta = "", note = "";
    if (x.key === s.stageKey){
      cls = "current" + (st.late ? " late" : "");
      const due = stageDue(s);
      meta = `Started ${fmt(s.stageAt)}` + (due && !x.final ? (now > due ? ` · <b style="color:var(--bad)">${dur(now - due)} over the ${hoursLabel(x.hours)} allowed</b>` : ` · due ${fmt(due)}`) : "");
      note = routeStageNote(s, x.key);
    } else if (i < curI){
      cls = "done"; meta = e ? fmt(e.at) : "Skipped";
    } else {
      meta = proj.out[x.key] ? `Expected ${fmt(proj.out[x.key])}` : x.phase === "store" ? `Kept up to ${daysLabel(Math.round(x.hours / 24))} after results` : `${hoursLabel(x.hours)} allowed`;
    }
    return `<li class="${cls}"><span class="dot">${cls === "done" ? "✓" : ""}</span><div><div class="st-name">${esc(x.name)}${x.redo && s.reassays ? ` <span class="pill warn">re-assayed ×${s.reassays}</span>` : ""}</div><div class="st-meta">${meta}</div>${note ? `<div class="st-note">${esc(note)}</div>` : ""}</div></li>`;
  }).join("");

  const hist = (s.history || []).slice().reverse().map(h => `<li>
      <div>${h.redo ? `<span class="pill warn">Re-assay</span> ` : h.reroute ? `<span class="pill info">Route changed</span> ` : ""}<b>${esc(stageName(s, h))}</b>${h.ref ? ` · <span>${esc(h.ref)}</span>` : ""}</div>
      <time>${fmt(h.at)} · by ${h.tech ? esc(h.tech) : h.name ? `${esc(h.name)} (submitter)` : who(h.by)}</time>
      ${h.note ? `<div>${esc(h.note)}</div>` : ""}</li>`).join("");

  const det = s.details ? Object.entries(s.details).map(([k, val]) => `${esc(k)}: <b>${esc(val)}</b>`).join(" · ") : "";
  const facts = [
    ["Sample type", esc(s.type)],
    ...(det ? [["Type details", det]] : []),
    ["Tag number", s.tagNo ? `<span class="mono">${esc(s.tagNo)}</span>` : "—"],
    ["Site reference", s.siteRef ? `<span class="mono">${esc(s.siteRef)}</span>` : "—"],
    ["Section", s.section ? `<span class="mono">${esc(s.section)}</span> ${esc(sectionName(s.section))}` : esc(s.department) || "—"],
    ["Submitted by", esc(s.submitter)],
    ["Collected", fmt(s.collectedAt)],
    ["Received by", s.receivedBy ? `${esc(s.receivedBy)} <span class="muted">(lab technician)</span>, ${fmt(s.receivedAt)}` : "—"],
    [s.createdBy === "public" ? "Submitted" : "Registered", `${fmt(s.createdAt)}${s.createdBy === "public" ? " through the submission form" : ` by ${s.createdByName ? esc(s.createdByName) : who(s.createdBy)}`}`],
    ["Assay purpose", esc(s.purpose)],
    ["Test requested", esc(s.testName || testOf(s.test)?.name || "") || "—"],
    ["Workflow route", s.route ? `<span class="code">${esc(s.route)}</span> ${esc(s.routeName || r?.name || "")} <button class="btn ghost small" data-route="${esc(s.route)}">See route</button>` : "Standard workflow (registered before routes were added)"],
    ["Add-on analyses", (s.analyses || []).map(esc).join(", ") || "—"],
    ...(s.reassays ? [["Re-assays", `${s.reassays}${s.lastRedo ? `, last: ${esc(s.lastRedo)}` : ""}`]] : []),
    ["Source location", esc(s.source) || "—"],
    ["Quantity", [s.containers ? `${esc(s.containers)} bag(s)/container(s)` : "", s.massKg ? `${esc(s.massKg)} kg` : ""].filter(Boolean).join(", ") || "—"],
    ["Seal / custody no.", s.seal ? `<span class="mono">${esc(s.seal)}</span>` : "—"],

async function freshUnderLease(docRef){
  let lease = null;
  for (let i = 0; i < 12 && !(lease && lease.acquired); i++){
    lease = await docRef.acquire({ holder: tabId, ttlMs: 6000 });
    if (!lease.acquired) await new Promise(r => setTimeout(r, 250 + Math.random() * 300));
  }
  if (!lease.acquired){ toast("Someone else is updating this sample. Try again in a moment."); return null; }
  const snap = await docRef.get();
  if (!snap.exists){ toast("This sample no longer exists."); return null; }
  return snap.data();
}
async function doReceipt(kind){
  if (!db || !current?.body || moving || !canEdit()) return;
  const seen = current.body, note = $("#mvNote")?.value.trim() || "", newCode = $("#rcRoute")?.value || "";
  if (kind !== "confirm" && !note){ toast(kind === "flag" ? "Describe the problem in the note first." : "Give the reason for rejecting in the note first."); $("#mvNote")?.focus(); return; }
  const at = kind === "confirm" && $("#rcAt")?.value ? new Date($("#rcAt").value).getTime() : Date.now();
  if (!(at > 0) || at > Date.now() + 10 * 60000){ toast("The date received cannot be in the future."); return; }
  moving = true; setMoveBusy(true);
  const docRef = db.doc("samples/" + seen.id);
  try {
    const s = await freshUnderLease(docRef); if (!s) return;
    if (!awaiting(s)){ toast(`${s.id} was already handled by someone else.`); return; }
    const now = Date.now(), base = { by: session.u, tech: session.name, ref: "" };
    let upd;
    if (kind === "confirm"){
      const nr = newCode && newCode !== s.route ? routeByCode(newCode) : null;
      upd = { stageKey: "received", stageAt: at, receivedBy: session.name, receivedAt: at, flag: "" };
      if (nr) Object.assign(upd, routeFields(nr, s));
      const msg = (note || "Receipt confirmed; sample matches submission") + (nr ? `. Route changed from ${s.route || "the standard workflow"} to ${nr.code}` : "");
      upd.history = [...(s.history || []), { ...base, key: "received", sn: HEAD[1].name, at, note: msg, ...(nr ? { reroute: true } : {}) }];
    } else if (kind === "flag"){
      upd = { flag: note, history: [...(s.history || []), { ...base, key: s.stageKey, sn: stage(s, s.stageKey)?.name, at: now, note: "Flagged: " + note }] };
    } else {
      upd = { stageKey: "rejected", stageAt: now, flag: "", history: [...(s.history || []), { ...base, key: "rejected", sn: "Rejected at receipt", at: now, note: "Rejected: " + note }] };
    }
    upd.updatedAt = now;
    await docRef.update(upd);
    if ($("#mvNote")) $("#mvNote").value = "";
    toast(kind === "confirm" ? `${s.id} received` : kind === "flag" ? `${s.id} flagged` : `${s.id} rejected`);
  } catch (e) { writeFailed(e); }
  finally { moving = false; setMoveBusy(false); }
}

let moving = false;
async function doMove(key){
  if (!db || !current?.body || moving || !canEdit()) return;
  const seen = current.body;
  const ref = $("#mvRef")?.value.trim() || "", note = $("#mvNote")?.value.trim() || "", tech = session.name;
  if (key === seen.stageKey && !ref && !note) { toast("Already at this stage. Add a note or location to record an update."); return; }
  moving = true; setMoveBusy(true);
  const docRef = db.doc("samples/" + seen.id);
  try {
    // Hold a short lease so two people recording at once cannot overwrite each other's history.
    const s = await freshUnderLease(docRef); if (!s) return;
    if (s.stageKey !== seen.stageKey){
      toast(`${s.id} was just moved to ${stage(s, s.stageKey)?.name || s.stageKey} by someone else. Check it and try again.`);
      return;
    }
    const at = Date.now();
    const entry = { key, sn: stage(s, key)?.name || key, at, by: session.u, tech, note, ref };
    const upd = { history: [...(s.history || []), entry], updatedAt: at };
    if (key !== s.stageKey){ upd.stageKey = key; upd.stageAt = at; }
    if (ref && (key === "storage" || /shelf|bin|rack|store|room|cabinet|vault|safe/i.test(ref))) upd.location = ref;
    await docRef.update(upd);
    if ($("#mvRef")) { $("#mvRef").value = ""; $("#mvNote").value = ""; }
    toast(`${s.id} recorded at ${stage(s, key)?.name || key}`);
  } catch (e) { writeFailed(e); }
  finally { moving = false; setMoveBusy(false); }
}
/* QC failed or a result needs repeating: back to the route's re-assay step. */
async function doRedo(){
  if (!db || !current?.body || moving || !canEdit()) return;
  const seen = current.body, why = $("#redoWhy")?.value || "Re-assay", note = $("#mvNote")?.value.trim() || "", ref = $("#mvRef")?.value.trim() || "";
  moving = true; setMoveBusy(true);
  const docRef = db.doc("samples/" + seen.id);
  try {
    const s = await freshUnderLease(docRef); if (!s) return;
    if (s.stageKey !== seen.stageKey){ toast(`${s.id} was just moved by someone else. Check it and try again.`); return; }
    const p = planOf(s), ri = redoIdx(s); if (ri < 0) return;
    const back = p[ri], at = Date.now();
    await docRef.update({ stageKey: back.key, stageAt: at, updatedAt: at, reassays: (s.reassays || 0) + 1, lastRedo: why,
      history: [...(s.history || []), { key: back.key, sn: back.name, at, by: session.u, tech: session.name, ref, redo: true, note: `Re-assay: ${why}${note ? ". " + note : ""}` }] });
    if ($("#mvRef")) { $("#mvRef").value = ""; $("#mvNote").value = ""; }
    toast(`${s.id} sent back to ${back.name}`);
  } catch (e) { writeFailed(e); }
  finally { moving = false; setMoveBusy(false); }
}
async function doReroute(){
  if (!db || !current?.body || moving || !canEdit()) return;
  const seen = current.body, r = routeByCode($("#rrCode")?.value), note = $("#mvNote")?.value.trim() || "", ref = $("#mvRef")?.value.trim() || "";

  const docRef = db.doc("samples/" + seen.id);
  try {
    const s = await freshUnderLease(docRef); if (!s) return;
    if (s.stageKey !== seen.stageKey){ toast(`${s.id} was just moved by someone else. Check it and try again.`); return; }
    const plan = buildPlan(r), cur = stage(s, s.stageKey);
    const to = plan.find(x => x.key === s.stageKey) || plan.find((x, i) => i >= 2 && x.phase === cur?.phase) || plan[2] || plan[1];

async function allocateIds(code, stamp, n){
  const ref = db.doc(`meta/counter-${code}-${stamp}`);
  for (let attempt = 0; attempt < 20; attempt++){
    const lease = await ref.acquire({ holder: tabId, ttlMs: 8000 });
    if (lease.acquired){
      const snap = await ref.get();
      const last = (snap.exists && +snap.data().last) || 0;
      await ref.set({ last: last + n, day: stamp, section: code });
      return Array.from({ length: n }, (_, i) => `${code}-${stamp}-${String(last + 1 + i).padStart(4, "0")}`);
    }
    await new Promise(r => setTimeout(r, 300 + Math.random() * 500));
  }
  throw { code: "busy" };
}
async function register(){
  const mode = $("#regForm")?.dataset.mode || "register", lab = mode === "register";
  if (lab && !canEdit()) return;
  if (!db){ toast("The shared register is not connected in this view."); return; }
  const btn = $("#rSubmit"), msg = $("#rMsg");
  const n = Math.max(1, Math.min(100, parseInt($("#rCount").value, 10) || 1));
  btn.disabled = true; msg.textContent = "Issuing IDs…";
  try {
    const code = $("#rSection").value;
    if (!code){ throw { code: "nosection" }; }
    const tyK = $("#rType").value, puK = $("#rPurpose").value, teK = $("#rTest").value, r = formRoute();
    if (!r){ throw { code: "noroute" }; }
    const now = Date.now();
    const recvAt = lab && $("#rRecvAt").value ? new Date($("#rRecvAt").value).getTime() : now;
    if (!(recvAt > 0) || recvAt > now + 10 * 60000){ throw { code: "baddate" }; }
    const submitter = $("#rSubmitter").value.trim();
    const tags = splitTags($("#rTag").value);
    if (n > 1 && tags.length > 1 && tags.length !== n){ throw { code: "tags", have: tags.length }; }
    const tagFor = i => !tags.length ? "" : n === 1 ? tags.join(", ") : tags.length === n ? tags[i] : `${tags[0]}-${i + 1}`;
    const details = {};
    (typeOf(tyK)?.fields || []).forEach(f => { const x = ($("#rD_" + f.k)?.value || "").trim(); if (x) details[f.l] = x; });
    const rf = routeFields(r, { test: teK });
    const start = lab ? "received" : "submitted", startName = rf.plan.find(x => x.key === start).name;
    const ids = await allocateIds(code, dayStamp(recvAt), n);
    const collected = $("#rCollected").value ? new Date($("#rCollected").value).getTime() : null;
    const base = {
      type: typeOf(tyK)?.name || tyK, typeKey: tyK, purpose: purposeOf(puK)?.name || puK, purposeKey: puK, ...rf, details, reassays: 0,
      submitter, section: code, receivedBy: lab ? session.name : "", receivedAt: lab ? recvAt : null, siteRef: $("#rSiteRef").value.trim(),
      source: $("#rSource").value.trim(), collectedAt: collected, containers: +$("#rContainers").value || null,
      massKg: +$("#rMass").value || null, seal: $("#rSeal").value.trim(), priority: $("#rPriority").value,
      analyses: ADDONS.filter((_, i) => $("#rAn" + i)?.checked), notes: $("#rNotes").value.trim(),
      createdAt: now, createdBy: lab ? session.u : "public", createdByName: lab ? session.name : submitter, updatedAt: now, stageKey: start, stageAt: recvAt, location: "", flag: "",
      batchId: n > 1 ? `${ids[0]}…${ids[n - 1].split("-").pop()}` : "", batchSize: n
    };
    for (let i = 0; i < n; i++){
      const body = { ...base, id: ids[i], batchIndex: i + 1, tagNo: tagFor(i), siteRef: n > 1 && base.siteRef ? `${base.siteRef}-${i + 1}` : base.siteRef,
        history: [lab ? { key: start, sn: startName, at: recvAt, by: session.u, tech: session.name, note: `Received and registered at the lab; route ${r.code}`, ref: "" }
                      : { key: start, sn: startName, at: now, by: "public", name: submitter, note: "Submitted through the submission form", ref: "" }] };
      await db.doc("samples/" + ids[i]).set(body);
      msg.textContent = `Saved ${i + 1} of ${n}…`;
    }
    msg.textContent = "";
    $("#rResult").innerHTML = `<div class="notice"><b>${n === 1 ? (lab ? "Sample registered." : "Sample submitted.") : `${n} samples ${lab ? "registered" : "submitted"}.`}</b> Write ${n === 1 ? "this ID" : "these IDs"} on the sample bag${n === 1 ? "" : "s"}${lab ? " and the submission form" : ", then bring or send the sample to the MET Lab. Its status shows “Awaiting receipt” until a lab technician confirms it has arrived"}:
      <div class="label-strip" style="margin-top:8px">${ids.map(id => `<code>${esc(id)}</code>`).join("")}</div>
      <div class="small" style="margin-top:8px">Workflow: <span class="code">${esc(r.code)}</span> ${esc(r.name)}. Results about ${hoursLabel(routeTat(r))} after the lab receives ${n === 1 ? "it" : "them"}.</div>
      <div class="row" style="margin-top:10px"><button type="button" class="btn" id="rCopy">Copy IDs</button>${n === 1 ? `<button type="button" class="btn" data-link="${esc(ids[0])}">Copy tracking link</button>` : ""}<button type="button" class="btn" data-open="${esc(ids[0])}">Track ${esc(ids[0])}</button><button type="button" class="btn ghost" id="rAgain">${lab ? "Register more" : "Submit another"}</button></div></div>`;
    $("#rCopy").onclick = () => navigator.clipboard.writeText(ids.join("\n")).then(() => toast("IDs copied"), () => toast("Copy blocked here. Select the IDs and copy them."));
    $("#rAgain").onclick = () => { $(lab ? "#view-register" : "#view-submit").innerHTML = ""; renderSampleForm(mode); };
    btn.disabled = true;
  } catch (e) {
    btn.disabled = false; msg.textContent = "";
    if (e && e.code === "nosection") toast("Choose the submitting section first.");
    else if (e && e.code === "noroute") toast("No workflow route covers this test. Ask the lab manager to add one.");
    else if (e && e.code === "baddate") toast("The date cannot be in the future.");
    else if (e && e.code === "tags") toast(`You entered ${e.have} tag numbers for ${n} samples. Enter one per sample, or a single starting tag.`);
    else if (e && e.code === "busy") toast("Someone else is issuing IDs right now. Try again in a moment.");
    else writeFailed(e);
  }
}

function renderRouteList(){
  const box = $("#rtList"); if (!box) return;
  const q = routesQ.trim().toLowerCase(), t = typeOf(routesType);
  const list = (cfg.routes || []).filter(r => (!t || (r.types || []).includes(t.key) || (t.tests || []).some(k => (r.tests || []).includes(k)))
    && (!q || [r.code, r.name, r.desc, ...(r.stages || []).map(x => x.name), ...(r.tests || []).map(k => testOf(k)?.name)].join(" ").toLowerCase().includes(q)));
  list.sort((a, b) => testRank(a) - testRank(b));
  let lastCat = "";
  box.innerHTML = list.length ? list.map(r => {
    const cat = routeCat(r), headHtml = cat !== lastCat ? `<h3 style="margin-top:${lastCat ? 10 : 0}px">${esc(cat)}</h3>` : "";
    lastCat = cat;
    const types = (r.types || []).filter(k => k !== "*").map(k => typeOf(k)?.name).filter(Boolean);
    const purp = (r.purposes || []).map(k => purposeOf(k)?.name).filter(Boolean);
    return `${headHtml}<details class="route" id="route-${esc(r.code)}" data-code="${esc(r.code)}" ${openRoutes.has(r.code) ? "open" : ""}>
      <summary><span class="code">${esc(r.code)}</span><b>${esc(r.name)}</b><span class="subtle" style="margin-left:auto">results about ${hoursLabel(routeTat(r))} after receipt</span></summary>
      <div class="body">
        ${r.desc ? `<p class="small" style="margin:0">${esc(r.desc)}</p>` : ""}
        <div class="small"><b>Test:</b> ${(r.tests || []).map(k => esc(testOf(k)?.name || k)).join(", ")}<br>
          <b>Sample types:</b> ${types.length ? esc(types.join(", ")) : ""}${(r.types || []).includes("*") ? (types.length ? ", and any other type" : "Any type") : ""}${purp.length ? `<br><b>Chosen first when the purpose is:</b> ${esc(purp.join(", "))}` : ""}</div>
        <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Step</th><th>Phase</th><th>Time allowed</th><th>Method and checks</th></tr></thead><tbody>${routeRows(r)}</tbody></table></div>
        ${r.qc ? `<div class="small"><b>QA/QC:</b> ${esc(r.qc)}</div>` : ""}
        ${(r.triggers || []).length ? `<div class="small"><b>Re-assay triggers</b><ul class="tight">${r.triggers.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        ${(r.retention || []).length ? `<div class="small"><b>Retention and disposal</b><ul class="tight">${r.retention.map(x => `<li>${esc(retentionLine(x))}</li>`).join("")}</ul></div>` : ""}
      </div></details>`;
  }).join("") : `<div class="panel empty"><strong>No routes match</strong>Clear the search or choose All sample types.</div>`;
  box.querySelectorAll("details.route").forEach(d => d.addEventListener("toggle", () => { d.open ? openRoutes.add(d.dataset.code) : openRoutes.delete(d.dataset.code); }));
}

/* ---------- settings (admin) ---------- */
let draft = null, draftDirty = false, routeIdx = 0;
const newKey = () => "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function renderStages(){
  const v = $("#view-stages");
  // Commit a pending edit first: blurring fires its change handler, which re-renders with the new value.
  if (v.contains(document.activeElement)) document.activeElement.blur();
  if (!draft) { draft = clone(cfg); draftDirty = false; }
  draft.users = draft.users || [];
  draft.routes = draft.routes && draft.routes.length ? draft.routes : clone(DEFAULT_ROUTES);
  const editable = isAdmin();
  if (!editable){ v.innerHTML = `<div class="notice warn">Only admins can change these settings.</div>`; return; }
  const userRows = draft.users.map((x, i) => `<tr>
    <td><input class="inp mono" style="width:130px" data-ui="${i}" data-uf="u" value="${esc(x.u)}" aria-label="Username"></td>
    <td><input class="inp" data-ui="${i}" data-uf="name" value="${esc(x.name)}" aria-label="Full name"></td>
    <td><select class="inp" style="width:auto" data-ui="${i}" data-uf="role" aria-label="Role">${Object.entries(ROLES).map(([k, l]) => `<option value="${k}" ${x.role === k ? "selected" : ""}>${l}</option>`).join("")}</select></td>
    <td><input class="inp mono" style="width:130px" data-ui="${i}" data-uf="pw" value="${esc(x.pw)}" aria-label="Password"></td>
    <td><button class="btn ghost danger" data-urm="${i}" aria-label="Remove account" ${x.u === session?.u ? "disabled title='You cannot remove your own account'" : ""}>✕</button></td></tr>`).join("");
  const secCount = code => [...samples.values()].filter(x => x.section === code).length;
  const secRows = draft.sections.map((x, i) => `<tr>
    <td><input class="inp mono" style="width:90px;text-transform:uppercase" maxlength="5" data-si="${i}" data-sf="code" value="${esc(x.code)}"></td>
    <td><input class="inp" data-si="${i}" data-sf="name" value="${esc(x.name)}"></td>
    <td class="mono">${secCount(x.code)}</td>
    <td><button class="btn ghost danger" data-srm="${i}" aria-label="Remove section">✕</button></td></tr>`).join("");
  if (routeIdx >= draft.routes.length) routeIdx = 0;
  const R = draft.routes[routeIdx];
  R.stages = R.stages || []; R.tests = R.tests || []; R.types = R.types || []; R.purposes = R.purposes || []; R.triggers = R.triggers || []; R.retention = R.retention || [];
  const inUse = [...samples.values()].filter(s => s.route === R.code && !status(s).closed).length;
  const checks = (group, items, have) => items.map(([k, l]) => `<label><input type="checkbox" data-rl="${group}" value="${esc(k)}" ${have.includes(k) ? "checked" : ""}> ${esc(l)}</label>`).join("");
  const stRows = R.stages.map((x, i) => `<tr>
    <td class="mono">${i + 3}</td>
    <td><input class="inp" style="min-width:200px" data-ri="${i}" data-rk="name" value="${esc(x.name)}" aria-label="Step name"></td>
    <td><input class="inp" style="width:90px" type="number" min="0" step="0.25" data-ri="${i}" data-rk="hours" value="${esc(x.hours)}" aria-label="Hours allowed"></td>
    <td><select class="inp" style="width:auto" data-ri="${i}" data-rk="phase" aria-label="Phase">${["intake", "prep", "test", "qc"].map(p => `<option value="${p}" ${x.phase === p ? "selected" : ""}>${PHASE_LABEL[p]}</option>`).join("")}</select></td>
    <td style="text-align:center"><input type="radio" name="redo" data-ri="${i}" data-rk="redo" ${x.redo ? "checked" : ""} aria-label="Re-assays restart here"></td>
    <td><input class="inp" style="min-width:240px" data-ri="${i}" data-rk="note" value="${esc(x.note || "")}" aria-label="Method and checks"></td>
    <td style="white-space:nowrap"><button class="btn ghost" data-rmv="${i}" data-d="-1" aria-label="Move up" ${i ? "" : "disabled"}>↑</button><button class="btn ghost" data-rmv="${i}" data-d="1" aria-label="Move down" ${i < R.stages.length - 1 ? "" : "disabled"}>↓</button><button class="btn ghost danger" data-rrm="${i}" aria-label="Remove step">✕</button></td></tr>`).join("");
  const keepRows = R.retention.map((x, i) => `<tr>
    <td><input class="inp" data-ti="${i}" data-tf="item" value="${esc(x.item)}" aria-label="Material"></td>
    <td><input class="inp" style="width:100px" type="number" min="0" step="1" data-ti="${i}" data-tf="days" value="${esc(x.days)}" aria-label="Days kept"><div class="small muted">${+x.days ? daysLabel(x.days) : "returned at release"}</div></td>
    <td><input class="inp" data-ti="${i}" data-tf="then" value="${esc(x.then)}" aria-label="Then"></td>
    <td><button class="btn ghost danger" data-trm="${i}" aria-label="Remove">✕</button></td></tr>`).join("");
  v.innerHTML = `<div class="stack">
    <div class="notice">Edit accounts, sections and workflow routes, then press Save settings. Changes apply for everyone.</div>

    <h2>Staff accounts</h2>
    <p class="small muted" style="margin:0">Anyone can submit a sample without an account. Lab technicians confirm receipt, register walk-in samples and record stages; their name is filled in automatically as "Received by" and on every stage update. Viewers can see the board and ledger but change nothing. Anyone can look up a sample by ID without an account.</p>
    <div class="mock"><b>Design prototype.</b><span>Passwords here are visible to anyone who opens the page. The real system should store hashed passwords on a server or use the company's existing staff sign-in.</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Username</th><th>Full name</th><th>Role</th><th>Password</th><th></th></tr></thead><tbody>${userRows}</tbody></table></div>
    <div class="row"><button class="btn" id="userAdd">Add account</button></div>

    <h2 style="margin-top:12px">Submitting sections</h2>
    <p class="small muted" style="margin:0">Sample IDs are the section code, the submission date and a running number, for example <span class="mono">${esc(exampleId((draft.sections[1] || draft.sections[0] || {code:"EXP"}).code))}</span>. Each section's number restarts at 0001 every day. Codes are 2 to 5 capital letters; changing a code only affects new samples.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Section name</th><th>Samples loaded</th><th></th></tr></thead><tbody>${secRows}</tbody></table></div>
    <div class="row"><button class="btn" id="secAdd">Add section</button></div>

    <h2 style="margin-top:12px">Workflow routes</h2>
    <p class="small muted" style="margin:0">A sample's route is chosen from its sample type, test and purpose when it is submitted. Changes apply to samples submitted after you save; samples already in the lab keep the steps they started with. Steps 1 and 2 (Submitted, Received &amp; logged) and the closing steps (Results released, storage, return or disposal) are shared by every route.</p>
    <div class="row"><select class="inp" id="rtPick" style="width:auto;max-width:100%" aria-label="Route to edit">${draft.routes.map((r, i) => `<option value="${i}" ${i === routeIdx ? "selected" : ""}>${esc(r.code)} · ${esc(r.name)}</option>`).join("")}</select>
      <button class="btn" id="rtCopy">Copy as new route</button><button class="btn ghost danger" id="rtDel">Remove route</button></div>
    <div class="panel stack">
      <div class="form">
        <label class="f">Route code<input class="mono" style="text-transform:uppercase" maxlength="10" data-rf="code" value="${esc(R.code)}"></label>
        <label class="f">Route name<input data-rf="name" value="${esc(R.name)}"></label>
        <label class="f full">Description<input data-rf="desc" value="${esc(R.desc || "")}"></label>
      </div>
      ${inUse ? `<p class="small muted" style="margin:0">${inUse} open sample(s) are on this route.</p>` : ""}
      <fieldset><div class="legend">Tests this route performs</div><div class="checks">${checks("tests", TESTS.map(t => [t.key, t.name]), R.tests)}</div></fieldset>
      <fieldset><div class="legend">Sample types it is meant for</div><div class="checks">${checks("types", [["*", "Any type"], ...TYPES.map(t => [t.key, t.name])], R.types)}</div></fieldset>
      <fieldset><div class="legend">Purposes it is chosen first for</div><div class="checks">${checks("purposes", PURPOSES.map(p => [p.key, p.name]), R.purposes)}</div></fieldset>
      <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Lab step</th><th>Hours</th><th>Phase</th><th>Re-assay restarts here</th><th>Method and checks</th><th></th></tr></thead><tbody>${stRows}</tbody></table></div>
      <div class="row"><button class="btn" id="rsAdd">Add step</button><span class="small muted">Results about <b>${hoursLabel(routeTat(R))}</b> after receipt.</span></div>
      <label class="f full">QA/QC rule<textarea data-rf="qc">${esc(R.qc || "")}</textarea></label>
      <label class="f full">Re-assay triggers (one per line)<textarea data-rf="triggers">${esc(R.triggers.join("\n"))}</textarea></label>
      <div class="legend" style="margin:0">Retention and disposal</div>
      <div class="tbl-wrap"><table><thead><tr><th>Material</th><th>Days kept after results</th><th>Then</th><th></th></tr></thead><tbody>${keepRows}</tbody></table></div>
      <div class="row"><button class="btn" id="rkAdd">Add material</button></div>
    </div>
    <div class="row" style="border-top:1px solid var(--line);padding-top:14px"><span style="flex:1"></span><button class="btn ghost" id="cfgReset">Restore default sections and routes</button><button class="btn ghost" id="cfgCancel">Discard changes</button><button class="btn primary big" id="cfgSave">Save settings</button></div>
  </div>`;
  const dirty = () => { draftDirty = true; renderStages(); };
  v.querySelectorAll("[data-sf]").forEach(el => el.addEventListener("change", () => {
    const x = draft.sections[+el.dataset.si];
    if (el.dataset.sf === "code"){
      const c = el.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 5);
      if (c.length < 2){ toast("Use 2 to 5 letters for a section code."); renderStages(); return; }
      if (draft.sections.some((y, j) => y.code === c && j !== +el.dataset.si)){ toast(`${c} is already used by another section.`); renderStages(); return; }
      x.code = c;
    } else x.name = el.value.trim() || x.code;
    dirty();
  }));
  v.querySelectorAll("[data-srm]").forEach(b => b.onclick = () => {
    if (draft.sections.length <= 1){ toast("Keep at least one section."); return; }
    draft.sections.splice(+b.dataset.srm, 1); dirty();
    toast("Section removed. Samples already registered under it keep their IDs.");
  });
  $("#secAdd").onclick = () => {
    let n = 1, c; do { c = "NEW" + (n > 1 ? n : ""); n++; } while (draft.sections.some(x => x.code === c));
    draft.sections.push({ code: c.slice(0, 5), name: "New section" }); dirty();
  };
  // Routes
  $("#rtPick").onchange = e => { routeIdx = +e.target.value; renderStages(); };
  v.querySelectorAll("[data-rf]").forEach(el => el.addEventListener("change", () => {
    const f = el.dataset.rf;
    if (f === "code"){
      const c = el.value.toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 10);
      if (c.length < 2){ toast("Use 2 to 10 letters, digits or dashes for a route code."); renderStages(); return; }
      if (draft.routes.some((y, j) => y.code === c && j !== routeIdx)){ toast(`${c} is already used by another route.`); renderStages(); return; }
      if (DEFAULT_ROUTES.some(d => d.code === R.code)) draft.removed = [...new Set([...(draft.removed || []), R.code])];
      R.code = c;
    } else if (f === "triggers") R.triggers = el.value.split("\n").map(x => x.trim()).filter(Boolean);
    else R[f] = el.value.trim();
    dirty();
  }));
  v.querySelectorAll("[data-rl]").forEach(el => el.addEventListener("change", () => {
    R[el.dataset.rl] = [...v.querySelectorAll(`[data-rl="${el.dataset.rl}"]:checked`)].map(x => x.value); dirty();
  }));
  v.querySelectorAll("[data-rk]").forEach(el => el.addEventListener("change", () => {
    const x = R.stages[+el.dataset.ri], f = el.dataset.rk;
    if (f === "redo"){ R.stages.forEach(y => delete y.redo); x.redo = true; }
    else if (f === "hours") x.hours = Math.max(0, +el.value || 0);
    else x[f] = f === "name" ? (el.value.trim() || "Unnamed step") : el.value.trim();
    dirty();
  }));
  v.querySelectorAll("[data-rmv]").forEach(b => b.onclick = () => { const i = +b.dataset.rmv, j = i + +b.dataset.d; [R.stages[i], R.stages[j]] = [R.stages[j], R.stages[i]]; dirty(); });
  v.querySelectorAll("[data-rrm]").forEach(b => b.onclick = () => { if (R.stages.length <= 1){ toast("A route needs at least one lab step."); return; } R.stages.splice(+b.dataset.rrm, 1); dirty(); });
  $("#rsAdd").onclick = () => { const qi = R.stages.findIndex(x => x.phase === "qc"); R.stages.splice(qi < 0 ? R.stages.length : qi, 0, { key: newKey(), name: "New step", hours: 2, phase: "test", note: "" }); dirty(); };
  v.querySelectorAll("[data-tf]").forEach(el => el.addEventListener("change", () => {
    const x = R.retention[+el.dataset.ti], f = el.dataset.tf;
    x[f] = f === "days" ? Math.max(0, Math.round(+el.value || 0)) : el.value.trim();
    dirty();
  }));
  v.querySelectorAll("[data-trm]").forEach(b => b.onclick = () => { R.retention.splice(+b.dataset.trm, 1); dirty(); });
  $("#rkAdd").onclick = () => { R.retention.push({ item: "Pulp", days: 90, then: "Disposed" }); dirty(); };
  $("#rtCopy").onclick = () => {
    let n = 2, c; do { c = `${R.code.slice(0, 7)}-${n++}`; } while (draft.routes.some(x => x.code === c));
    const copy = clone(R); copy.code = c; copy.name = "Copy of " + R.name; copy.stages.forEach(x => x.key = RESERVED.includes(x.key) ? newKey() : x.key);
    draft.routes.push(copy); routeIdx = draft.routes.length - 1; dirty();
  };
  $("#rtDel").onclick = () => {
    if (draft.routes.length <= 1){ toast("Keep at least one route."); return; }
    if (DEFAULT_ROUTES.some(d => d.code === R.code)) draft.removed = [...new Set([...(draft.removed || []), R.code])];
    draft.routes.splice(routeIdx, 1); routeIdx = 0; dirty();
    toast("Route removed. Samples already on it keep their steps.");
  };
  $("#cfgReset").onclick = () => { draft.sections = clone(DEFAULT_CONFIG.sections); draft.routes = clone(DEFAULT_ROUTES); draft.removed = []; routeIdx = 0; dirty(); toast("Default sections and routes restored. Save to apply."); };
  $("#cfgCancel").onclick = () => { draft = clone(cfg); draftDirty = false; renderStages(); };
  v.querySelectorAll("[data-uf]").forEach(el => el.addEventListener("change", () => {
    const i = +el.dataset.ui, f = el.dataset.uf, x = draft.users[i];
    let val = el.value.trim();
    if (f === "u"){
      val = val.toLowerCase().replace(/[^a-z0-9._-]/g, "");
      if (!val){ toast("Usernames need letters or numbers."); renderStages(); return; }
      if (draft.users.some((y, j) => y.u === val && j !== i)){ toast(`${val} is already taken.`); renderStages(); return; }
      if (x.u === session.u){ toast("You cannot rename the account you are signed in with."); renderStages(); return; }
    }
    if (f === "role" && x.u === session.u && val !== "admin"){ toast("You cannot remove admin rights from your own account."); renderStages(); return; }
    if (f === "pw" && !val){ toast("A password cannot be empty."); renderStages(); return; }
    x[f] = f === "name" ? (val || x.u) : val;
    dirty();
  }));
  v.querySelectorAll("[data-urm]").forEach(b => b.onclick = () => { draft.users.splice(+b.dataset.urm, 1); dirty(); });
  $("#userAdd").onclick = () => {
    let n = 1, u; do { u = "tech" + n++; } while (draft.users.some(x => x.u === u));
    draft.users.push({ u, name: "New lab technician", role: "tech", pw: "tech123" }); dirty();
  };
  $("#cfgSave").onclick = async () => {
    if (!draft.users.some(x => x.role === "admin")){ toast("Keep at least one admin account."); return; }
    for (const [i, r] of draft.routes.entries()){
      const bad = msg => { routeIdx = i; renderStages(); toast(`${r.code}: ${msg}`); };
      if (!r.tests.length) return bad("tick at least one test.");
      if (!r.stages.length) return bad("add at least one lab step.");
      const keys = r.stages.map(x => x.key);
      if (new Set(keys).size !== keys.length || keys.some(k => RESERVED.includes(k))) r.stages.forEach((x, j) => { if (RESERVED.includes(x.key) || keys.indexOf(x.key) !== j) x.key = newKey(); });
    }
    const uncovered = TESTS.filter(t => !draft.routes.some(r => r.tests.includes(t.key))).map(t => t.name);
    try {
      await db.doc("settings/stages").set({ sections: clone(draft.sections), users: clone(draft.users), routes: clone(draft.routes), removed: (draft.removed || []).filter(c => !draft.routes.some(r => r.code === c)), updatedAt: Date.now(), updatedBy: session.u });
      draftDirty = false; draft = null; renderStages();
      toast(uncovered.length ? `Saved. No route performs: ${uncovered.slice(0, 3).join(", ")}${uncovered.length > 3 ? "…" : ""}` : "Settings saved for everyone.");
    }
    catch (e) { e?.code === "invalid_argument" ? toast("This copy of the prototype is view-only for your claude.ai account, so settings can't be saved.") : toast("Could not save settings."); }
  };
}

function refreshRegisterOptions(){
  const sel = $("#rSection"); if (!sel) return;
  const keep = sel.value;
  sel.innerHTML = `<option value="">Choose…</option>` + (cfg.sections || []).map(x => `<option value="${esc(x.code)}">${esc(x.code)} · ${esc(x.name)}</option>`).join("");
  sel.value = keep;
}
function setSync(state){
  const el = $("#sync"); if (!el) return;
  const map = { live: ["ok", "Live, in sync"], saving: ["gold", "Saving…"], stale: ["warn", "Reconnecting…"], off: ["bad", "Not connected"] };
  const [cls, txt] = map[state] || map.off;
  el.className = "pill " + cls; el.textContent = txt;
}

/* ---------- boot ---------- */
function rerenderSoon(){ clearTimeout(rerenderSoon.t); rerenderSoon.t = setTimeout(() => { if (!["register", "submit", "routes"].includes(tab)) renderTab(); else $("#cntActive").textContent = [...samples.values()].filter(s => !status(s).closed).length; }, 60); }
const hash = decodeURIComponent((location.hash || "").slice(1));
if (hash) { $("#lookupInput").value = hash; current = { id: normId(hash), body: null, loading: true }; tab = "track"; }
else tab = lsGet("session") ? "board" : "submit";
resolveSession();
setTab(tab);

(async () => {
  if (!window.claude?.use){ setSync("off"); return; }
  [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (user) canWrite = await user.can("data.write");
  if (!db){ setSync("off"); renderTab(); return; }
  db.doc("settings/stages").onSnapshot(snap => {
    if (snap.exists){
      const d = snap.data();
      cfg = {
        routes: mergeRoutes(d.routes, d.removed), removed: Array.isArray(d.removed) ? d.removed.slice() : [],
        sections: Array.isArray(d.sections) && d.sections.length ? clone(d.sections) : clone(DEFAULT_CONFIG.sections),
        users: Array.isArray(d.users) && d.users.length ? clone(d.users) : clone(DEFAULT_CONFIG.users)
      };
    }
    if (!draftDirty) draft = null;          // someone else's save shows up unless you have unsaved edits
    else if (tab === "stages") toast("Someone else just saved settings. Discard your changes to see theirs.");
    refreshRegisterOptions();
    const before = session && JSON.stringify(session);
    resolveSession();                       // an admin may have changed this account's role or removed it
    if (before && before !== JSON.stringify(session)){ $("#view-register").innerHTML = ""; if (!session) toast("Your account was changed by an admin. Please sign in again."); setTab(tab); }
    refreshFormRoute();
    if (tab === "routes" && !$("#view-routes").contains(document.activeElement)) renderRoutes();
    rerenderSoon();
  }, () => {});
  db.collection("samples").orderBy("createdAt", "desc").limit(1000).onSnapshot(snap => {
    samples.clear(); snap.docs.forEach(d => samples.set(d.id, d.data()));
    setSync(snap.metadata.hasPendingWrites ? "saving" : snap.metadata.fromCache ? "stale" : "live");
    if (current && !current.body && samples.has(current.id)) current = { id: current.id, body: samples.get(current.id), missing: false };
    rerenderSoon();
  }, () => { setSync("off"); toast("Lost connection to the register. Reload the page."); });
  if (current) openSample(current.id); else renderTab();
  if (!session && (tab === "login" || tab === "submit")) renderTab();
  setInterval(() => {
    if (tab === "board") renderTab();
    else if (tab === "track" && !document.activeElement?.closest?.("#moveForm")) renderTab();
  }, 60000);
})();
})();
</script>
