name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_COAST_08ABB7803 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/app" # App source code path
          api_location: "/api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
      # Proof the deploy is live: the site's version.json names this commit's build (build.py writes it with the page). Reads only.
      - name: Check the live site serves this build
        if: github.event_name == 'push'
        run: |
          want=$(python3 -c "import json; print(json.load(open('app/version.json'))['build'])")
          for i in $(seq 1 30); do
            got=$(curl -fsS -m 20 "https://happy-coast-08abb7803.5.azurestaticapps.net/version.json?t=$(date +%s)" | python3 -c "import sys, json; print(json.load(sys.stdin).get('build', ''))" 2>/dev/null || true)
            echo "live build: ${got:-none}; this build: $want"
            if [ "$got" = "$want" ]; then
              curl -fsS -m 20 -o /dev/null -w "page: HTTP %{http_code}\n" "https://happy-coast-08abb7803.5.azurestaticapps.net/?t=$(date +%s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the live site does not serve this build after 5 minutes"
          exit 1

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_COAST_08ABB7803 }}
          action: "close"
